                        "contentHtml": "<section id=\"reports-and-viewpoints-h-0-что-такое-доклад-в-рабочем-смысле\"><h2>Что такое доклад в рабочем смысле</h2>\n<p>В контексте Цифрового двойника 2.0 доклад — это не просто текстовое сообщение, а подготовленный набор карты, объектов, слоёв и ракурсов, который помогает провести разговор последовательно. Пользователь заранее определяет, с какой точки начнётся показ, какие территории будут показаны дальше и на каких данных должен держаться рассказ.</p>\n</section>\n<section id=\"reports-and-viewpoints-h-1-зачем-сохранять-ракурсы\"><h3>Зачем сохранять ракурсы</h3>\n<p>Ракурсы нужны, чтобы не восстанавливать вручную каждый удачный вид. Один ракурс может показывать общий контекст района, другой — конкретный объект, третий — соседнюю территорию или конфликтную точку. Когда ракурсы продуманы заранее, показ становится плавным и убедительным, а пользователю не приходится в реальном времени искать нужный вид.</p>\n</section>\n<section id=\"reports-and-viewpoints-h-2-как-подбирать-ракурсы\"><h2>Как подбирать ракурсы</h2>\n<p>Каждый ракурс должен отвечать на один понятный вопрос. Не сохраняйте пять почти одинаковых видов только потому, что они выглядят красиво. Намного полезнее иметь 3–4 смысловых точки: обзорную, уточняющую, сравнительную и итоговую. Такая последовательность помогает не только выступающему, но и участникам совещания.</p>\n</section>\n<section id=\"reports-and-viewpoints-h-3-как-связывать-ракурс-со-слоями-и-объектами\"><h2>Как связывать ракурс со слоями и объектами</h2>\n<p>Если ракурс требует специальных слоёв, проверяйте это заранее. Иначе сохранённый вид может оказаться формально правильным, но бессмысленным, потому что ключевые данные в нём не включены. Аналогично, если ракурс должен открывать конкретный объект, полезно убедиться, что карточка объекта и карта вместе дают ожидаемый контекст.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Сохранение и переключение между ракурсами для доклада</figcaption></figure>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Последовательность обзорного и уточняющего ракурса в одном сценарии показа</figcaption></figure>\n</section>\n<section id=\"reports-and-viewpoints-h-4-что-считается-удачным-набором-ракурсов\"><h3>Что считается удачным набором ракурсов</h3>\n<p>Набор ракурсов удачен, если по нему можно провести человека от общего к частному без слов «сейчас попробую снова найти это место». Хороший докладный контекст ощущается как собранная история, а не как серия случайных перемещений по карте.</p>\n</section>\n<section id=\"reports-and-viewpoints-h-5-как-обновлять-докладные-материалы\"><h2>Как обновлять докладные материалы</h2>\n<p>После изменения территории, объекта или набора слоёв ракурсы полезно перепроверять. Старый ракурс может оставаться технически доступным, но уже хуже отвечать на текущую задачу. Перед важным обсуждением лучше открыть каждый ракурс и убедиться, что он по-прежнему раскрывает нужный смысл.</p>\n</section>\n<section id=\"reports-and-viewpoints-h-6-типовые-ошибки\"><h2>Типовые ошибки</h2>\n<p>Частые ошибки — сохранение слишком похожих видов, отсутствие связи между ракурсом и активными слоями, попытка показать слишком много в одном кадре и отсутствие прогонки доклада до начала совещания. Если при переключении между ракурсами вы сами теряете мысль, аудитории будет ещё сложнее.</p>\n</section>"

                        "contentHtml": "<section id=\"territory-demo-checklist-h-0-как-строить-демонстрацию-территории\"><h2>Как строить демонстрацию территории</h2>\n<p>Хорошая демонстрация начинается с общего вида, затем ведёт к конкретной территории, после чего показывает один или несколько смысловых акцентов через слои, карточки и ракурсы. Такой порядок помогает аудитории не потеряться и понимать, как отдельные детали связаны с общей картиной. Если начать сразу с перегруженного детального вида, участникам сложнее включиться в обсуждение.</p>\n</section>\n<section id=\"territory-demo-checklist-h-1-какой-темп-показа-считается-удобным\"><h3>Какой темп показа считается удобным</h3>\n<p>Темп должен быть чуть медленнее, чем кажется комфортным самому подготовившему материал пользователю. Вы знаете территорию заранее, а аудитория видит её в текущем виде впервые. Поэтому полезно делать короткие паузы после смены ракурса, включения слоя или открытия карточки, чтобы у зрителей было время считать изменение.</p>\n</section>\n<section id=\"territory-demo-checklist-h-2-какой-чек-лист-пройти-за-несколько-минут-до-нача\"><h2>Какой чек-лист пройти за несколько минут до начала</h2>\n<p>Перед совещанием стоит проверить:</p>\n<ul><li>открывается ли нужная территория;</li><li>включены ли только релевантные слои;</li><li>читаются ли подписи и обозначения;</li><li>открываются ли карточки ключевых объектов;</li><li>работают ли сохранённые ракурсы или рабочие столы;</li><li>не осталось ли на экране лишних панелей.</li></ul>\n<p>Этот небольшой список спасает гораздо чаще, чем кажется.</p>\n</section>\n<section id=\"territory-demo-checklist-h-3-что-делать-во-время-непредвиденной-ошибки\"><h2>Что делать во время непредвиденной ошибки</h2>\n<p>Если в момент показа что-то пошло не так, не пытайтесь одновременно объяснять и хаотично исправлять экран. Лучше кратко озвучить, что именно проверяете, вернуться к последнему понятному состоянию и повторить действие спокойно. Аудитория лучше воспринимает короткую паузу с понятной логикой, чем нервную попытку моментально восстановить всё сразу.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Чистый демонстрационный экран перед началом совещания</figcaption></figure>\n</section>\n<section id=\"territory-demo-checklist-h-4-как-понять-что-показ-прошeл-успешно\"><h3>Как понять, что показ прошёл успешно</h3>\n<p>Успешный показ — это не отсутствие вообще любых микрозадержек, а ситуация, когда участники понимают территорию, видят ключевые объекты, не путаются в слоях и могут обсуждать вопрос по существу. Если интерфейс перестал быть отдельной темой разговора, значит подготовка и демонстрация сработали.</p>\n</section>\n<section id=\"territory-demo-checklist-h-5-что-делать-после-совещания\"><h2>Что делать после совещания</h2>\n<p>Сразу после показа полезно сохранить удачные материалы, а лишние временные настройки убрать. Если появились новые акценты, лучше сразу обновить рабочий стол или набор ракурсов, пока контекст свеж в памяти. Это особенно помогает, когда обсуждение продолжается в несколько этапов.</p>\n</section>\n<section id=\"territory-demo-checklist-h-6-частые-ошибки-на-финальном-этапе\"><h2>Частые ошибки на финальном этапе</h2>\n<p>Типовые проблемы — отсутствие последней проверки перед показом, слишком быстрый темп, перегруженный экран и попытка «доказать всё сразу» через большое количество слоёв. Для совещания лучше подходит короткий и чистый маршрут, чем максимально полный, но трудно считываемый экран.</p>\n</section>"

                        "contentHtml": "<section id=\"create-workspace-h-0-что-такое-рабочий-стол\"><h2>Что такое рабочий стол</h2>\n<p>Рабочий стол — это сохранённый контекст работы: территория, набор слоёв, выбранные объекты, иногда ракурсы и дополнительные блоки, необходимые для одной темы. Его задача — сократить число ручных действий при повторном входе в сценарий. Вместо того чтобы каждый раз искать одну и ту же территорию и включать одинаковые данные, пользователь открывает готовую конфигурацию.</p>\n</section>\n<section id=\"create-workspace-h-1-когда-имеет-смысл-создавать-рабочий-стол\"><h3>Когда имеет смысл создавать рабочий стол</h3>\n<p>Создавайте рабочий стол, если сценарий повторяется больше одного раза. Это может быть постоянная территория наблюдения, еженедельный показ, группа объектов по одной теме или рабочее направление, в котором вы регулярно используете один и тот же набор данных. Для разовой задачи рабочий стол не обязателен, но для повторяемой — почти всегда полезен.</p>\n</section>\n<section id=\"create-workspace-h-2-как-собрать-основу-рабочего-стола\"><h2>Как собрать основу рабочего стола</h2>\n<p>Сначала определите территорию или тему. Затем включите 1–3 ключевых слоя, найдите важные объекты и убедитесь, что карта выглядит чисто и понятно на стартовом масштабе. Если сценарий предполагает дальнейшее обсуждение, полезно сразу продумать порядок действий после открытия рабочего стола, а не только его стартовый экран.</p>\n</section>\n<section id=\"create-workspace-h-3-что-должно-войти-в-минимальную-конфигурацию\"><h2>Что должно войти в минимальную конфигурацию</h2>\n<p>Минимальный рабочий стол обычно включает:</p>\n<ul><li>стартовую территорию;</li><li>базовую подложку;</li><li>ключевые тематические слои;</li><li>список важных объектов или открываемых карточек;</li><li>понятное название, отражающее тему.</li></ul>\n<p>Даже такой короткий набор уже делает повторную работу заметно быстрее.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Создание нового рабочего стола на основе текущей территории и слоёв</figcaption></figure>\n</section>\n<section id=\"create-workspace-h-4-как-назвать-рабочий-стол-полезно-а-не-формально\"><h3>Как назвать рабочий стол полезно, а не формально</h3>\n<p>Название должно объяснять, зачем этот рабочий стол нужен. Лучше использовать схему «тема + территория + назначение», чем общие фразы вроде «Новый стол 1» или «Рабочий вариант». Понятное название помогает и вам самим, и коллегам, если рабочий стол потом используется совместно.</p>\n</section>\n<section id=\"create-workspace-h-5-как-понять-что-рабочий-стол-готов\"><h2>Как понять, что рабочий стол готов</h2>\n<p>Готовый рабочий стол должен открываться в состоянии, которое уже полезно для работы. Если после запуска вам всё равно приходится вручную искать территорию, вспоминать слои и открывать объекты, значит конфигурация сохранена слишком бедно и её стоит доработать.</p>\n</section>\n<section id=\"create-workspace-h-6-частые-ошибки-при-создании\"><h2>Частые ошибки при создании</h2>\n<p>Основные ошибки — создание слишком общих рабочих столов, сохранение перегруженного экрана и бессмысленные названия. Кроме того, пользователи иногда сохраняют рабочий стол до того, как проверили тему и читаемость слоёв. Намного лучше сначала пройти сценарий целиком, и только потом сохранять удачную конфигурацию.</p>\n</section>"

                        "contentHtml": "<section id=\"presets-and-context-h-0-зачем-нужны-пресеты-внутри-рабочего-стола\"><h2>Зачем нужны пресеты внутри рабочего стола</h2>\n<p>Рабочий стол становится особенно полезным, когда в нём сохранены не только география и подложка, но и продуманный набор слоёв и объектов. Такой пресет избавляет от рутины: пользователь открывает нужный сценарий и сразу получает связную картину по теме, а не собирает её заново из отдельных частей.</p>\n</section>\n<section id=\"presets-and-context-h-1-как-подбирать-состав-пресета\"><h3>Как подбирать состав пресета</h3>\n<p>Каждый пресет должен иметь рабочую причину существования. Если он посвящён территории для совещания, в него должны войти только те слои и объекты, которые помогают обсуждать именно эту тему. Если пресет нужен для оперативного обзора, достаточно базовых данных и нескольких маркеров. Старайтесь избегать добавления данных «на всякий случай».</p>\n</section>\n<section id=\"presets-and-context-h-2-как-сочетать-слои-и-объекты\"><h2>Как сочетать слои и объекты</h2>\n<p>Лучший результат получается, когда слои отвечают за фон и контекст, а объекты — за точки внимания. Например, сначала пользователь видит территорию с базовыми границами и тематическими данными, а затем переходит к нескольким ключевым объектам через список сохранений. Такой сценарий естественно воспринимается и при личной работе, и при совместном показе.</p>\n</section>\n<section id=\"presets-and-context-h-3-как-пересматривать-пресет-со-временем\"><h2>Как пересматривать пресет со временем</h2>\n<p>Любой пресет нужно периодически проверять. Состав данных может меняться, а рабочий фокус — смещаться. Если спустя время вы замечаете, что половина включённых слоёв не используется, а нужных объектов всё нет, лучше обновить конфигурацию. Поддерживаемый пресет работает заметно лучше, чем однажды сохранённый и забытый.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Пресет рабочего стола со слоями, сохранёнными объектами и стартовым видом</figcaption></figure>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Переключение между пресетами под разные рабочие темы</figcaption></figure>\n</section>\n<section id=\"presets-and-context-h-4-как-понять-что-пресет-неудачный\"><h3>Как понять, что пресет неудачный</h3>\n<p>Пресет неудачен, если он перегружает карту, дублирует уже существующий сценарий, открывается слишком медленно или требует сразу нескольких ручных исправлений после запуска. Если при повторном использовании вы каждый раз выключаете одни и те же слои, значит конфигурация нуждается в пересборке.</p>\n</section>\n<section id=\"presets-and-context-h-5-какой-результат-считать-хорошим\"><h2>Какой результат считать хорошим</h2>\n<p>Хороший пресет позволяет за несколько секунд перейти в знакомый рабочий контекст, где уже есть нужная территория, понятный набор слоёв и важные объекты. Пользователь не вспоминает, что ещё нужно включить, а сразу начинает работать по существу. Именно в этом состоит основная ценность рабочих столов.</p>\n</section>\n<section id=\"presets-and-context-h-6-частые-ошибки\"><h2>Частые ошибки</h2>\n<p>Часто пользователи сохраняют один огромный пресет «на всё», а потом удивляются, что он неудобен. Ещё одна ошибка — смешивать в одном рабочем столе несколько несвязанных тем. Лучше иметь два-три компактных сценария, чем один универсальный, но тяжёлый и непредсказуемый.</p>\n</section>"

                        "contentHtml": "<section id=\"collaboration-stats-export-h-0-для-чего-нужны-совместные-сценарии\"><h2>Для чего нужны совместные сценарии</h2>\n<p>Рабочие столы особенно ценны, когда ими пользуется не один человек, а команда. В этом случае они становятся общим рабочим контекстом: несколько участников открывают одну и ту же территорию, видят одинаковый набор ключевых слоёв и обсуждают одни и те же объекты. Это снижает риск расхождения в интерпретации и ускоряет подготовку к общим встречам.</p>\n</section>\n<section id=\"collaboration-stats-export-h-1-что-важно-проверить-перед-совместным-использован\"><h3>Что важно проверить перед совместным использованием</h3>\n<p>Перед тем как делиться рабочим столом, проверьте, что:</p>\n<ul><li>его название понятно без дополнительных объяснений;</li><li>стартовый экран не перегружен;</li><li>критичные слои доступны целевой группе пользователей;</li><li>сохранённые объекты действительно относятся к теме;</li><li>в конфигурации нет временных или случайных элементов.</li></ul>\n<p>Такая проверка помогает сделать общий контекст устойчивым.</p>\n</section>\n<section id=\"collaboration-stats-export-h-2-как-использовать-статистику-по-рубрикам\"><h2>Как использовать статистику по рубрикам</h2>\n<p>Если в рабочем столе доступны счётчики, подборки или статистические блоки, используйте их как краткое сопровождение к карте, а не как замену самому пространственному анализу. Статистика полезна тогда, когда она помогает быстро понять объём, состав или распределение объектов в выбранной теме, а затем перейти к карте и проверить детали на территории.</p>\n</section>\n<section id=\"collaboration-stats-export-h-3-когда-нужен-экспорт\"><h2>Когда нужен экспорт</h2>\n<p>Экспорт полезен в двух случаях: когда нужно передать результат дальше в другой процесс или когда после обсуждения требуется зафиксировать состав подборки, статистический срез или рабочую конфигурацию. При экспорте важно помнить, что он фиксирует момент состояния. Если данные в системе обновятся позже, экспортированный результат уже не изменится автоматически.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Совместное использование рабочего стола в командном сценарии</figcaption></figure>\n</section>\n<section id=\"collaboration-stats-export-h-4-как-обеспечить-одинаковое-понимание-у-команды\"><h3>Как обеспечить одинаковое понимание у команды</h3>\n<p>Недостаточно просто дать ссылку или название рабочего стола. Полезно коротко объяснить, что в нём является главным: территориальный фокус, набор слоёв, ключевые объекты и смысл статистических блоков. Чем яснее договорённость о назначении рабочего стола, тем меньше вероятность, что коллеги начнут использовать его для несвязанных задач.</p>\n</section>\n<section id=\"collaboration-stats-export-h-5-что-считать-успешным-результатом\"><h2>Что считать успешным результатом</h2>\n<p>Совместная работа через рабочий стол успешна, если несколько участников быстро входят в одинаковый контекст, могут показать один и тот же набор данных и не тратят время на уточнение, какую именно территорию и какие слои сейчас нужно обсуждать. Если ещё и статистика или экспорт поддерживают этот сценарий без ручной пересборки, рабочий стол работает правильно.</p>\n</section>\n<section id=\"collaboration-stats-export-h-6-частые-ошибки-в-командной-работе\"><h2>Частые ошибки в командной работе</h2>\n<p>Наиболее частые проблемы — передача «сырого» рабочего стола без проверки, использование названий, понятных только автору, и ожидание, что у всех участников будут идентичные права. Кроме того, пользователи иногда полагаются только на статистику и забывают проверять её через карту. Лучший подход — сочетать общий контекст, понятную структуру и краткое объяснение назначения рабочего стола.</p>\n</section>"

    function linkGlossaryTerms(html, product, articleId) {
      if (!["digital-twin-20", "digital-twin-30"].includes(product?.id) || articleId === "glossary") return html;
      if (!html || !sharedGlossaryTerms.length) return html;

      const aliasEntries = [];
      sharedGlossaryTerms.forEach((item) => {
        [item.term, ...(item.aliases || [])].forEach((alias) => {
          if (alias && alias.trim().length > 1) {
            aliasEntries.push({ alias, key: item.term.toLowerCase(), item });
          }
        });
      });
      aliasEntries.sort((a, b) => b.alias.length - a.alias.length);

      const template = document.createElement("template");
      template.innerHTML = html;
      const aliasesPattern = aliasEntries.map((entry) => escapeRegExp(entry.alias)).join("|");
      const boundary = "A-Za-zА-Яа-яЁё0-9_";
      const regex = new RegExp(`(^|[^${boundary}])(${aliasesPattern})(?=$|[^${boundary}])`, "giu");
      const linked = new Set();
      const nodes = [];
      const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          const parent = node.parentElement;
          if (!parent || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (parent.closest("a, code, pre, script, style, .termRef, .glossaryGrid, .glossaryModules")) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach((node) => {
        const text = node.nodeValue;
        let lastIndex = 0;
        let changed = false;
        const fragment = document.createDocumentFragment();

        text.replace(regex, (match, prefix, alias, offset) => {
          const entry = aliasEntries.find((candidate) => candidate.alias.toLowerCase() === alias.toLowerCase());
          if (!entry || linked.has(entry.key) || linked.size >= 18) return match;

          const aliasStart = offset + prefix.length;
          fragment.append(document.createTextNode(text.slice(lastIndex, aliasStart)));
          const link = document.createElement("a");
          link.className = "termRef";
          link.href = glossaryHref(product, entry.item.term);
          link.dataset.definition = entry.item.definition;
          link.textContent = text.slice(aliasStart, aliasStart + alias.length);
          fragment.append(link);
          lastIndex = aliasStart + alias.length;
          linked.add(entry.key);
          changed = true;
          return match;
        });

        if (changed) {
          fragment.append(document.createTextNode(text.slice(lastIndex)));
          node.parentNode.replaceChild(fragment, node);
        }
      });

      return template.innerHTML;
    }

    function getArticleContext(product, articleId) {
      for (const section of product.sections) {
        if (section.id === articleId) return { section, article: makeSectionArticle(product, section), level: "section" };
        const groups = getSectionGroups(section);
        for (let groupIndex = 0; groupIndex < groups.length; groupIndex += 1) {
          const group = groups[groupIndex];
          if (groupArticleId(section, groupIndex) === articleId) return { section, group, groupIndex, article: makeGroupArticle(product, section, group, groupIndex), level: "group" };
        }
        const articles = section.articles || [];
        const article = articles.find((item) => item.id === articleId);
        if (article) {
          const groupIndex = groups.findIndex((group) => groupContainsArticle(group, article.id));
          return { section, group: groups[groupIndex], groupIndex, article, level: "article" };
        }
      }

      const section = getSection(product, articleId);
      const article = section?.articles?.length ? makeSectionArticle(product, section) : {
        id: section.id,
        title: "Камеры",
        short: section.desc,
        tags: ["#Обзор", "#Руководство"],
        tocPreview: [],
        contentHtml: fallbackArticleHtml()
      };
      return { section, article };
    }

    function firstArticlePath(product, section) {
      return `/home/${product.id}/${section.id}`;
    }

    function getSectionGroups(section) {
      if (section.articleGroups?.length) return section.articleGroups;
      if (section.articles?.length) return [{ title: section.title, articles: section.articles }];
      return [];
    }

    function groupContainsArticle(group, articleId) {
      return group.articles?.some((article) => article.id === articleId);
    }

    function getDocSequence(product) {
      const docs = [];
      product.sections.forEach((section) => {
        docs.push({ id: section.id, title: section.title, level: "section", section });
        getSectionGroups(section).forEach((group, groupIndex) => {
          docs.push({ id: groupArticleId(section, groupIndex), title: group.title, level: "group", section, group });
          (group.articles || []).forEach((article) => docs.push({ id: article.id, title: article.title, level: "article", section, group, article }));
        });
      });
      return docs;
    }

    function getAdjacentDocs(product, articleId) {
      const docs = getDocSequence(product);
      const index = docs.findIndex((doc) => doc.id === articleId);
      return {
        previous: index > 0 ? docs[index - 1] : null,
        next: index >= 0 && index < docs.length - 1 ? docs[index + 1] : null
      };
    }

    function getRelatedDocs(product, section, article) {
      const context = getArticleContext(product, article.id);
      const primary = (context.group?.articles?.length ? context.group.articles : section.articles || [])
        .filter((item) => item.id !== article.id);
      const fallback = (section.articles || []).filter((item) => item.id !== article.id && !primary.some((doc) => doc.id === item.id));
      return [...primary, ...fallback].slice(0, 3);
    }

    function renderDocCallout(type, title, text) {

    function renderRelatedDocs(product, section, article) {

          </div>

    }

    function renderArticlePager(product, article) {
      const { previous, next } = getAdjacentDocs(product, article.id);
      if (!previous && !next) return "";
      const link = (doc, dir) => doc ? `
        <a class="pagerLink ${dir}" href="/home/${product.id}/${doc.id}" data-nav="/home/${product.id}/${doc.id}">
          <span class="pagerLabel">${dir === "previous" ? "Предыдущая статья" : "Следующая статья"}</span>
          <span class="pagerTitle">${doc.title}</span>
        </a>
      ` : `<div></div>`;
      return `<nav class="articlePager" aria-label="Переход между статьями">${link(previous, "previous")}${link(next, "next")}</nav>`;
    }

    function navigate(path) {
      history.pushState({}, "", withBasePath(path));
      renderRoute();
      if (location.hash) {
        requestAnimationFrame(() => {
          const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
          target?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function renderOldHeader(product = null) {
      if (product) {
        oldBrand.className = "oldBrand";
        oldBrand.innerHTML = `${guideBookLogo()}<span class="productBrandText">Руководство<br>пользователя</span>`;
      } else {
        oldBrand.className = "oldBrand";
        oldBrand.innerHTML = `${guideBookLogo()}<span class="productBrandText">Руководство<br>пользователя</span>`;
      }

    function cardTemplate(item, attrs) {
      return `
        <a class="oldCard" href="${attrs.href}" ${attrs.data}>
          <div class="cardImageWrap"><img src="${assets}${item.image || item.icon}" alt=""></div>
          <h2>${item.title}</h2>
          <p>${item.desc}</p>
        </a>
      `;
    }

    function productStats(product) {
      const sections = product.sections.length;
      const articles = getDocSequence(product).length;
      const images = product.sections.reduce((sum, section) => {
        const countInArticle = (html = "") => (html.match(/imagePlaceholder/g) || []).length;
        const groupImages = (section.groups || []).reduce((groupSum, group) => {
          return groupSum + (group.articles || []).reduce((articleSum, article) => articleSum + countInArticle(article.contentHtml), 0);
        }, 0);
        return sum + (section.articles || []).reduce((articleSum, article) => articleSum + countInArticle(article.contentHtml), 0) + groupImages;
      }, 0);
      return { sections, articles, images };
    }

    function productQuickDocs(product) {
      return getDocSequence(product).slice(0, 4);
    }

    function getSectionDocs(section) {
      const groups = getSectionGroups(section);
      return [
        { id: section.id, title: section.title },
        ...groups.flatMap((group, groupIndex) => [
          { id: groupArticleId(section, groupIndex), title: group.title },
          ...(group.articles || [])
        ])
      ];
    }

    function productTopicCardTemplate(product, section, index) {
      const articleCount = getSectionDocs(section).length;
      const groupCount = getSectionGroups(section).length;
      return `
        <a class="productTopicCard" href="${firstArticlePath(product, section)}" data-section="${section.id}">
          <span class="topicNumber">${String(index + 1).padStart(2, "0")}</span>
          <span class="topicInfo">
            <h3>${section.title}</h3>
            <p>${section.desc}</p>
            <span class="topicMeta">${articleCount} ${articleCount === 1 ? "статья" : "статей"} <span>·</span> ${groupCount || 1} ${groupCount === 1 ? "подтема" : "подтем"}</span>
          </span>
        </a>
      `;
    }

    function bindMarketingSearch(items, targetId, template) {
      const input = document.getElementById("homeSearch");
      const target = document.getElementById(targetId);
      if (!input || !target) return;
      input.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();
        const filtered = items.filter((item) => `${item.title} ${item.desc}`.toLowerCase().includes(query));
        target.innerHTML = filtered.map(template).join("") || `<div class="emptySearchState">Ничего не найдено</div>`;
      });
    }

    function showArticle(productId, sectionId) {
      if (cleanupArticleHeaderTitle) cleanupArticleHeaderTitle();
      if (cleanupTocObserver) cleanupTocObserver();
      const product = getProduct(productId);
      const { section, article } = getArticleContext(product, sectionId);
      const isGlossary = article?.id === "glossary" || section?.kind === "glossary";
      state.productId = product.id;
      state.sectionId = article.id;
      marketingPage.classList.add("hidden");
      outlinePage.classList.remove("hidden");
      outlinePage.classList.toggle("editing", state.isEditing);
      outlinePage.innerHTML = `

    function productShortTitle(product) {
      if (product.id === "digital-twin-20") return "ЦД 2.0";
      if (product.id === "digital-twin-30") return "ЦД 3.0";

    }

    function sidebarSectionIcon(section) {
      const map = {
        overview: "book-open",
        access: "clipboard-list",
        glossary: "book-open-text",
        "quick-start": "zap",
        map: "search",
        layers: "layers",
        objects: "scan-search",
        meetings: "play-square",
        workspaces: "wrench"
      };
      return map[section.id] || (section.articles?.length ? "folder" : "file-text");
    }

    function renderBreadcrumbs(product, section, article) {
      const crumbs = [
        { title: "Главная", href: "/home" },
        { title: productShortTitle(product), href: `/home/${product.id}` }
      ];
      if (section?.title && section.title !== article?.title) {
        crumbs.push({ title: section.title, href: `/home/${product.id}/${section.id}` });
      }
      crumbs.push({ title: article?.title || section?.title || "Статья" });

      return `
        <nav class="articleBreadcrumbs" aria-label="Хлебные крошки">
          ${crumbs.map((crumb, index) => `
            ${index > 0 ? `<span class="breadcrumbDivider">/</span>` : ""}
            ${crumb.href && index < crumbs.length - 1
              ? `<a href="${crumb.href}" data-nav="${crumb.href}">${escapeHtml(crumb.title)}</a>`
              : `<span aria-current="page">${escapeHtml(crumb.title)}</span>`}
          `).join("")}
        </nav>
      `;
    }

    function renderSidebar(product, selectedSection, selectedArticle) {
      const hasArticleTree = product.sections.some((section) => section.articles?.length);
      const selectedArticleId = selectedArticle?.id || selectedSection?.articles?.[0]?.id || selectedSection?.id;
      const shortTitle = productShortTitle(product);
      const introSections = product.sections.filter((section) => section.id === "overview");
      const workSections = product.sections.filter((section) => section.id !== "overview");

      const renderSectionTree = (sections) => sections.map((section) => {
        const articles = section.articles || [];
        const groups = getSectionGroups(section);
        const hasChildren = groups.length > 0 || articles.length > 0;
        const isSelectedSection = section.id === selectedSection.id;
        const isSectionArticle = selectedArticleId === section.id;
        const isExpanded = state.expandedTree[section.id] ?? isSelectedSection;
        const sectionPath = firstArticlePath(product, section);
        const icon = sidebarSectionIcon(section);

        if (!hasArticleTree) {
          return `
            <div class="treeNode ${isSelectedSection ? "expanded" : ""}">
              <button class="treeItem ${isSelectedSection ? "selected" : ""}" data-nav="/home/${product.id}/${section.id}">
                <i data-lucide="${icon}" width="16" height="16"></i>
                <span>${section.title}</span>
              </button>
            </div>
          `;
        }

        return `
          <div class="treeNode ${isExpanded ? "expanded" : ""}">
            <button class="treeItem ${isSectionArticle ? "selected" : isSelectedSection ? "ancestor" : ""}" data-nav="${sectionPath}">
              <i data-lucide="${icon}" width="16" height="16"></i>
              <span>${section.title}</span>
            </button>
            ${hasChildren ? `<button class="treeToggle" data-action="toggle-tree" data-section-id="${section.id}" aria-label="${isExpanded ? "Свернуть" : "Развернуть"} ${section.title}">
              <span class="srOnly">${isExpanded ? "Свернуть" : "Развернуть"}</span>
              <i data-lucide="${isExpanded ? "chevron-up" : "chevron-down"}" width="16" height="16"></i>
            </button>` : ""}
          </div>
          ${isExpanded && hasChildren ? `
            <div class="treeChildren" aria-label="Подтемы раздела ${section.title}">
              ${groups.map((group, groupIndex) => {
                const groupId = groupArticleId(section, groupIndex);
                const groupIsArticle = selectedArticleId === groupId;
                const groupHasSelectedArticle = groupContainsArticle(group, selectedArticleId);
                const groupExpanded = state.expandedGroups[groupId] ?? (groupIsArticle || groupHasSelectedArticle);
                return `
                  <div class="treeChildNode ${groupExpanded ? "expanded" : ""}">
                    <button class="treeChild ${groupIsArticle ? "selected" : groupHasSelectedArticle ? "ancestor" : ""}" data-nav="/home/${product.id}/${groupId}">
                      <i data-lucide="folder" width="16" height="16"></i>
                      <span>${group.title}</span>
                    </button>
                    ${(group.articles?.length || 0) > 0 ? `
                      <button class="treeChildToggle" data-action="toggle-tree-group" data-group-id="${groupId}" aria-label="${groupExpanded ? "Свернуть" : "Развернуть"} ${group.title}">
                        <span class="srOnly">${groupExpanded ? "Свернуть" : "Развернуть"}</span>
                        <i data-lucide="${groupExpanded ? "chevron-up" : "chevron-down"}" width="15" height="15"></i>
                      </button>
                    ` : ""}
                  </div>
                  ${groupExpanded ? `
                    <div class="treeGrandChildren" aria-label="Статьи подтемы ${group.title}">
                      ${(group.articles || []).map((article) => `
                        <button class="treeGrandChild ${article.id === selectedArticleId ? "selected" : ""}" data-nav="/home/${product.id}/${article.id}">
                          <span class="treeDot" aria-hidden="true"></span>
                          <span>${article.title}</span>
                        </button>
                      `).join("")}
                    </div>
                  ` : ""}
                `;
              }).join("") || articles.map((article) => `
                <button class="treeChild ${article.id === selectedArticleId ? "selected" : ""}" data-nav="/home/${product.id}/${article.id}">
                  <i data-lucide="file-text" width="16" height="16"></i>
                  <span>${article.title}</span>
                </button>
              `).join("")}
            </div>
          ` : ""}
        `;
      }).join("");

      const favorites = product.sections.slice(0, 4).map((section) => {
        const article = section.articles?.[0];
        return { title: article?.title || section.title, href: article ? `/home/${product.id}/${article.id}` : `/home/${product.id}/${section.id}` };
      });
      const productMenu = products.map((menuProduct) => {
        const selected = menuProduct.id === product.id;
        return `
          <button type="button" class="productSwitchItem ${selected ? "selected" : ""}" data-nav="/home/${menuProduct.id}" role="menuitem" aria-current="${selected ? "true" : "false"}">
            ${redLogo(24).replace("homeLogo", "productSwitchLogo")}
            <span>${escapeHtml(menuProduct.title)}</span>
            ${selected ? `<i class="productSwitchCheck" data-lucide="check" width="20" height="20"></i>` : ""}
          </button>
        `;
      }).join("");

      return `
        <aside class="sidebar">
          <nav class="tree">
            <section class="productSwitcher" aria-label="Выбранный продукт">
              <div class="productSwitcherHead">
                ${redLogo(40).replace("homeLogo", "productSwitcherLogo")}
                <div class="productSwitcherText">
                  <strong>${shortTitle}</strong>
                  <span>Цифровой двойник</span>
                </div>
                <button type="button" class="productSwitcherControl" data-action="product-switch" aria-label="Переключить продукт" aria-expanded="false">
                  <i data-lucide="chevron-down" width="20" height="20"></i>
                </button>
              </div>
              <div class="productStats" aria-label="Статистика продукта">
                <span>15</span><span>15</span><span>15</span>
              </div>
              <button type="button" class="productHomeButton" data-nav="/home/${product.id}">
                <i data-lucide="home" width="18" height="18"></i>
                <span>Главная продукта</span>
                <i data-lucide="chevron-right" width="18" height="18"></i>
              </button>
              <div class="productSwitcherMenu" role="menu" aria-label="Список продуктов">
                ${productMenu}
              </div>
            </section>
            <div class="treeGroup sidebarGroup">
              <div class="sidebarGroupTitle">Введение</div>
              ${renderSectionTree(introSections)}
              <button class="treeItem utility" data-action="demo">
                <i data-lucide="list" width="16" height="16"></i>
                <span>Что нового в обновление</span>
              </button>
            </div>
            <div class="treeGroup sidebarGroup workTreeGroup">
              <div class="sidebarGroupHeader">
                <span>Работа с ЦД</span>
                <span class="sidebarGroupActions"><i data-lucide="more-horizontal" width="16" height="16"></i><i data-lucide="plus" width="16" height="16"></i></span>
              </div>
              ${renderSectionTree(workSections)}
            </div>
            <div class="favoriteTitle">Избранное</div>
            ${favorites.map((item) => `
              <button class="treeItem nested" data-nav="${item.href}">
                <i data-lucide="bookmark" width="16" height="16"></i>
                <span>${item.title}</span>
              </button>
            `).join("")}
          </nav>
        </aside>
      `;
    }

    function renderArticle(product, section, article) {

      return `

    function renderCommentsPanel() {
      commentsPanel.innerHTML = `
        <h3>Комментарии</h3>
        <textarea id="commentInput" placeholder="Напишите комментарий"></textarea>
        <button class="primary" data-action="add-comment">Добавить</button>
        <div class="commentList">
          ${state.comments.map((comment) => `<div class="commentItem">${comment}</div>`).join("")}
        </div>
      `;
      commentsPanel.classList.add("open");
    }

    function refreshSidebar() {
      const product = getProduct(state.productId);
      const { section, article } = getArticleContext(product, state.sectionId);
      const sidebar = outlinePage.querySelector(".sidebar");
      if (!sidebar) return;
      sidebar.outerHTML = renderSidebar(product, section, article);
      createIcons();
    }

    function bindArticleHeaderTitle() {
      if (cleanupArticleHeaderTitle) cleanupArticleHeaderTitle();

      const topbar = document.querySelector(".topbar");
      const articleTitle = document.querySelector(".article h1");
      const headerTitle = document.querySelector(".topbarArticleTitle");
      if (!topbar || !articleTitle || !headerTitle) return;

      headerTitle.textContent = articleTitle.textContent.trim();

      const updateHeaderTitle = () => {
        const titleRect = articleTitle.getBoundingClientRect();
        const topbarRect = topbar.getBoundingClientRect();
        const start = topbarRect.bottom + 10;
        const progress = Math.min(1, Math.max(0, (start - titleRect.bottom) / 46));
        const shift = Math.round((1 - progress) * 5 * 100) / 100;
        headerTitle.style.opacity = progress.toFixed(3);
        headerTitle.style.transform = `translate(-50%, calc(-50% + ${shift}px))`;
        topbar.classList.toggle("titleVisible", progress > 0.02);
      };

      updateHeaderTitle();
      window.addEventListener("scroll", updateHeaderTitle, { passive: true });
      window.addEventListener("resize", updateHeaderTitle);
      cleanupArticleHeaderTitle = () => {
        window.removeEventListener("scroll", updateHeaderTitle);
        window.removeEventListener("resize", updateHeaderTitle);
        cleanupArticleHeaderTitle = null;
      };
    }

    function buildArticleToc() {
      const article = document.getElementById("article");
      const tocInner = document.querySelector(".tocInner");
      if (!article || !tocInner) return;

      const headings = [...article.querySelectorAll("h2, h3")].filter((heading) => !heading.closest("[data-toc-exclude='true'], .articleFeedback, .articlePager, .articleFooter"));
      tocInner.innerHTML = headings.map((heading, index) => {
        const target = heading.closest("section[id]") || heading;
        if (!target.id) target.id = `article-heading-${index}`;
        const level = heading.tagName === "H2" ? 2 : 3;
        return `<button class="tocLink level${level}" data-scroll="${target.id}">${heading.textContent.trim()}</button>`;
      }).join("");
    }

    function bindTocObserver() {
      if (cleanupTocObserver) cleanupTocObserver();
      const links = [...document.querySelectorAll(".tocLink")];
      const sections = links.map((link) => document.getElementById(link.dataset.scroll)).filter(Boolean);
      const tocInner = document.querySelector(".tocInner");
      if (!links.length || !sections.length || !tocInner) return;

      const updateTocProgress = () => {
        const activationY = 150;
        const lastLink = links[links.length - 1];
        const tocMaxHeight = lastLink.offsetTop + lastLink.offsetHeight;
        const article = document.getElementById("article");
        const lastSection = sections[sections.length - 1];
        const isAtPageBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 8;
        const isAtArticleBottom = article ? article.getBoundingClientRect().bottom <= window.innerHeight + 96 : false;
        const isLastSectionReadable = lastSection.getBoundingClientRect().top <= window.innerHeight * 0.88;
        let lastReadIndex = sections.reduce((last, section, index) => {
          return section.getBoundingClientRect().top <= activationY ? index : last;
        }, -1);
        if (lastReadIndex < 0) lastReadIndex = 0;
        if (isAtPageBottom || isAtArticleBottom || isLastSectionReadable) lastReadIndex = links.length - 1;
        const currentIndex = Math.max(0, lastReadIndex);
        tocInner.style.setProperty("--toc-line-height", `${tocMaxHeight}px`);

        links.forEach((link, index) => {
          link.classList.toggle("read", index <= lastReadIndex);
          link.classList.toggle("current", index === lastReadIndex);
        });

        const currentLink = links[currentIndex];
        const nextLink = links[Math.min(currentIndex + 1, links.length - 1)];
        const currentBottom = currentLink.offsetTop + currentLink.offsetHeight;
        let target = currentBottom;

        if (currentIndex < sections.length - 1 && !isAtPageBottom) {
          const currentSection = sections[currentIndex];
          const nextSection = sections[currentIndex + 1];
          const currentRect = currentSection.getBoundingClientRect();
          const nextRect = nextSection.getBoundingClientRect();
          const sectionSpan = Math.max(1, nextRect.top - currentRect.top);
          const sectionProgress = Math.min(1, Math.max(0, (activationY - currentRect.top) / sectionSpan));
          target = currentBottom + (nextLink.offsetTop - currentBottom) * sectionProgress;
        }

        tocInner.style.setProperty("--toc-progress", `${Math.min(tocMaxHeight, Math.max(0, target))}px`);
      };

      updateTocProgress();
      window.addEventListener("scroll", updateTocProgress, { passive: true });
      window.addEventListener("resize", updateTocProgress);
      cleanupTocObserver = () => {
        window.removeEventListener("scroll", updateTocProgress);
        window.removeEventListener("resize", updateTocProgress);
        cleanupTocObserver = null;
      };
    }

    function renderRoute() {
      const parts = getAppPathname().split("/").filter(Boolean);
      const productId = parts[1];
      const sectionId = parts[2];
      state.isEditing = false;
      if (!productId) {
        renderLanding();
      } else if (!sectionId) {
        renderProductHome(productId);
      } else {
        showArticle(productId, sectionId);
      }
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-nav], [data-product], [data-section]");
      if (nav) {
        event.preventDefault();
        document.querySelectorAll(".productSwitcher.open").forEach((item) => {
          item.classList.remove("open");
          item.querySelector(".productSwitcherControl")?.setAttribute("aria-expanded", "false");
        });
        if (nav.dataset.nav) navigate(nav.dataset.nav);
        if (nav.dataset.product) navigate(`/home/${nav.dataset.product}`);
        if (nav.dataset.section) navigate(`/home/${state.productId}/${nav.dataset.section}`);
        return;
      }

      const link = event.target.closest("a[href^='/home']");
      if (link) {
        event.preventDefault();
        navigate(link.getAttribute("href"));
        return;
      }

      const scrollTarget = event.target.closest("[data-scroll]");
      if (scrollTarget) {
        document.getElementById(scrollTarget.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (!action) return;

      if (action === "edit") {
        state.isEditing = !state.isEditing;
        showArticle(state.productId, state.sectionId);
      } else if (action === "save") {
        const product = getProduct(state.productId);
        const { article } = getArticleContext(product, state.sectionId);
        localStorage.setItem(`article:${storageVersion}:${product.id}:${article.id}`, document.getElementById("article").innerHTML);
        showToast("Сохранено");
      } else if (action === "comments") {
        renderCommentsPanel();
      } else if (action === "feedback-useful") {
        showToast("Спасибо за отзыв");
      } else if (action === "feedback-not-useful") {
        renderCommentsPanel();
        showToast("Расскажите, что можно улучшить");
      } else if (action === "add-comment") {
        const input = document.getElementById("commentInput");
        const value = input.value.trim();
        if (value) {
          state.comments.unshift(value);
          renderCommentsPanel();
          showToast("Комментарий добавлен");
        }
      } else if (action === "search") {
        showToast("Поиск по статьям выбранного продукта");
      } else if (action === "product-switch") {
        const switcher = event.target.closest(".productSwitcher");
        const control = event.target.closest(".productSwitcherControl");
        const isOpen = !switcher?.classList.contains("open");
        document.querySelectorAll(".productSwitcher.open").forEach((item) => {
          if (item !== switcher) {
            item.classList.remove("open");
            item.querySelector(".productSwitcherControl")?.setAttribute("aria-expanded", "false");
          }
        });
        switcher?.classList.toggle("open", isOpen);
        control?.setAttribute("aria-expanded", String(isOpen));
      } else if (action === "profile") {
        showToast("Профиль пользователя");
      } else if (action === "notify") {
        showToast("Уведомлений нет");
      } else if (action === "share") {
        navigator.clipboard?.writeText(location.href);
        showToast("Ссылка скопирована");
      } else if (action === "favorite") {
        showToast("Добавлено в избранное");
      } else if (action === "toggle-tree") {
        const sectionId = event.target.closest("[data-section-id]")?.dataset.sectionId;
        if (sectionId) {
          const product = getProduct(state.productId);
          const { section } = getArticleContext(product, state.sectionId);
          state.expandedTree[sectionId] = !(state.expandedTree[sectionId] ?? sectionId === section.id);
          refreshSidebar();
        }
      } else if (action === "toggle-tree-group") {
        const groupId = event.target.closest("[data-group-id]")?.dataset.groupId;
        if (groupId) {
          state.expandedGroups[groupId] = !(state.expandedGroups[groupId] ?? false);
          refreshSidebar();
        }
      } else if (action === "section-child") {
        document.querySelectorAll(".treeChild.selected, .treeGrandChild.selected").forEach((item) => item.classList.remove("selected"));
        event.target.closest(".treeChild, .treeGrandChild")?.classList.add("selected");
        showToast("Вложенная статья открыта");
      } else if (action === "shortcuts") {
        showToast("Горячие клавиши: ⌘K, Esc, B, I");
      } else {
        showToast("Демо-действие выполнено");
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".productSwitcher")) {
        document.querySelectorAll(".productSwitcher.open").forEach((item) => {
          item.classList.remove("open");
          item.querySelector(".productSwitcherControl")?.setAttribute("aria-expanded", "false");
        });
      }

      if (!commentsPanel.contains(event.target) && !event.target.closest("[data-action='comments']")) {
        commentsPanel.classList.remove("open");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        document.querySelectorAll(".productSwitcher.open").forEach((item) => {
          item.classList.remove("open");
          item.querySelector(".productSwitcherControl")?.setAttribute("aria-expanded", "false");
        });
      }
    });

    document.addEventListener("click", (event) => {
      const command = event.target.closest("[data-command]")?.dataset.command;
      if (command) {
        document.execCommand(command, false, null);
        document.getElementById("article")?.focus();
      }
    });

    window.addEventListener("popstate", renderRoute);

    const dotGrid = {
      initialized: false,
      raf: null,
      dots: [],
      dpr: 1,
      pointer: { x: -9999, y: -9999, vx: 0, vy: 0, speed: 0, lastTime: 0, lastX: 0, lastY: 0 },
      config: {
        dotSize: 6,
        gap: 22,
        baseColor: "#f3f3f3",
        activeColor: "#ff004e",
        proximity: 180,
        speedTrigger: 120,
        shockRadius: 190,
        shockStrength: 7,
        maxSpeed: 4000,
        resistance: 1200,
        returnDuration: 2.4,
        maxOffset: 10
      }
    };

    function throttle(func, limit) {
      let lastCall = 0;
      return function throttled(...args) {
        const now = performance.now();
        if (now - lastCall >= limit) {
          lastCall = now;
          func.apply(this, args);
        }
      };
    }

    function hexToRgb(hex) {
      const match = hex.match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
      if (!match) return { r: 0, g: 0, b: 0 };
      return {
        r: parseInt(match[1], 16),
        g: parseInt(match[2], 16),
        b: parseInt(match[3], 16)
      };
    }

    function mixColor(base, active, t) {
      const r = Math.round(base.r + (active.r - base.r) * t);
      const g = Math.round(base.g + (active.g - base.g) * t);
      const b = Math.round(base.b + (active.b - base.b) * t);
      return `rgb(${r},${g},${b})`;
    }

    function clampDotPush(x, y, multiplier = 1) {
      const limit = dotGrid.config.maxOffset * multiplier;
      const length = Math.hypot(x, y);
      if (length <= limit || length === 0) return { x, y };
      const scale = limit / length;
      return { x: x * scale, y: y * scale };
    }

    function buildDotGrid() {
      const canvas = document.getElementById("dotCanvas");
      if (!canvas || !dotStage) return;
      const { dotSize, gap } = dotGrid.config;
      const rect = dotStage.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      dotGrid.dpr = dpr;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cell = dotSize + gap;
      const cols = Math.floor((rect.width + gap) / cell);
      const rows = Math.floor((rect.height + gap) / cell);
      const gridW = cell * cols - gap;
      const gridH = cell * rows - gap;
      const startX = (rect.width - gridW) / 2 + dotSize / 2;
      const startY = (rect.height - gridH) / 2 + dotSize / 2;

      dotGrid.dots = [];
      for (let y = 0; y < rows; y += 1) {
        for (let x = 0; x < cols; x += 1) {
          dotGrid.dots.push({
            cx: startX + x * cell,
            cy: startY + y * cell,
            xOffset: 0,
            yOffset: 0,
            _inertiaApplied: false
          });
        }
      }
    }

    function initDotGrid() {
      buildDotGrid();
      if (dotGrid.initialized) return;
      dotGrid.initialized = true;
      const throttledMove = throttle(onDotGridMove, 50);
      window.addEventListener("mousemove", throttledMove, { passive: true });
      window.addEventListener("click", onDotGridClick);
      window.addEventListener("resize", () => window.setTimeout(buildDotGrid, 80));
      dotGrid.raf = requestAnimationFrame(drawDots);
    }

    function onDotGridMove(event) {
      const canvas = document.getElementById("dotCanvas");
      if (!canvas) return;
      const now = performance.now();
      const pointer = dotGrid.pointer;
      const dt = pointer.lastTime ? now - pointer.lastTime : 16;
      const dx = event.clientX - pointer.lastX;
      const dy = event.clientY - pointer.lastY;
      let vx = (dx / dt) * 1000;
      let vy = (dy / dt) * 1000;
      let speed = Math.hypot(vx, vy);
      if (speed > dotGrid.config.maxSpeed) {
        const scale = dotGrid.config.maxSpeed / speed;
        vx *= scale;
        vy *= scale;
        speed = dotGrid.config.maxSpeed;
      }
      pointer.lastTime = now;
      pointer.lastX = event.clientX;
      pointer.lastY = event.clientY;
      pointer.vx = vx;
      pointer.vy = vy;
      pointer.speed = speed;

      const rect = canvas.getBoundingClientRect();
      pointer.x = event.clientX - rect.left;
      pointer.y = event.clientY - rect.top;

      for (const dot of dotGrid.dots) {
        const dist = Math.hypot(dot.cx - pointer.x, dot.cy - pointer.y);
        if (speed > dotGrid.config.speedTrigger && dist < dotGrid.config.proximity && !dot._inertiaApplied) {
          dot._inertiaApplied = true;
          const push = clampDotPush(dot.cx - pointer.x + vx * 0.002, dot.cy - pointer.y + vy * 0.002);
          animateDotPush(dot, push.x, push.y);
        }
      }
    }

    function onDotGridClick(event) {
      const canvas = document.getElementById("dotCanvas");
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const cx = event.clientX - rect.left;
      const cy = event.clientY - rect.top;
      for (const dot of dotGrid.dots) {
        const dist = Math.hypot(dot.cx - cx, dot.cy - cy);
        if (dist < dotGrid.config.shockRadius && !dot._inertiaApplied) {
          dot._inertiaApplied = true;
          const falloff = Math.max(0, 1 - dist / dotGrid.config.shockRadius);
          const push = clampDotPush(
            (dot.cx - cx) * dotGrid.config.shockStrength * falloff,
            (dot.cy - cy) * dotGrid.config.shockStrength * falloff,
            1.25
          );
          animateDotPush(dot, push.x, push.y);
        }
      }
    }

    function animateDotPush(dot, pushX, pushY) {
      if (window.gsap) {
        window.gsap.killTweensOf(dot);
        window.gsap.to(dot, {
          xOffset: pushX,
          yOffset: pushY,
          duration: Math.min(0.55, Math.max(0.18, 900 / dotGrid.config.resistance)),
          ease: "power3.out",
          onComplete: () => {
            window.gsap.to(dot, {
              xOffset: 0,
              yOffset: 0,
              duration: dotGrid.config.returnDuration,
              ease: "elastic.out(1,0.75)",
              onComplete: () => {
                dot._inertiaApplied = false;
              }
            });
          }
        });
      } else {
        dot.xOffset = pushX;
        dot.yOffset = pushY;
        window.setTimeout(() => {
          dot.xOffset = 0;
          dot.yOffset = 0;
          dot._inertiaApplied = false;
        }, dotGrid.config.returnDuration * 1000);
      }
    }

    function drawDots() {
      const canvas = document.getElementById("dotCanvas");
      if (canvas && !marketingPage.classList.contains("hidden")) {
        const ctx = canvas.getContext("2d");
        const rect = dotStage.getBoundingClientRect();
        const baseRgb = hexToRgb(dotGrid.config.baseColor);
        const activeRgb = hexToRgb(dotGrid.config.activeColor);
        const proxSq = dotGrid.config.proximity * dotGrid.config.proximity;
        ctx.clearRect(0, 0, rect.width, rect.height);
        for (const dot of dotGrid.dots) {
          const ox = dot.cx + dot.xOffset;
          const oy = dot.cy + dot.yOffset;
          const dx = dot.cx - dotGrid.pointer.x;
          const dy = dot.cy - dotGrid.pointer.y;
          const dsq = dx * dx + dy * dy;
          let fill = dotGrid.config.baseColor;
          if (dsq <= proxSq) {
            const dist = Math.sqrt(dsq);
            fill = mixColor(baseRgb, activeRgb, 1 - dist / dotGrid.config.proximity);
          }
          ctx.beginPath();
          ctx.arc(ox, oy, dotGrid.config.dotSize / 2, 0, Math.PI * 2);
          ctx.fillStyle = fill;
          ctx.fill();
        }
      }
      dotGrid.raf = requestAnimationFrame(drawDots);
    }

    try {
      renderRoute();
    } catch (error) {
      console.error(error);
      document.body.dataset.renderError = error?.message || "Render error";
    }
  </script>
</body>
</html>
