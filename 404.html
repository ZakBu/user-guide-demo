<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Руководство пользователя</title>
  <script>
    (() => {
      const path = window.location.pathname;
      const homeIndex = path.indexOf("/home");
      let basePath = "";

      if (homeIndex > 0) {
        basePath = path.slice(0, homeIndex);
      } else if (path.endsWith("/index.html")) {
        basePath = path.slice(0, -"/index.html".length);
      } else if (path.endsWith("/404.html")) {
        basePath = path.slice(0, -"/404.html".length);
      }

      const base = document.createElement("base");
      base.href = `${window.location.origin}${basePath || ""}/`;
      document.head.appendChild(base);
    })();
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

      content: "";

      width: 10px;
      height: 10px;

      if (path.endsWith("/404.html")) return path.slice(0, -"/404.html".length);
      return path === "/" ? "" : path.replace(/\/$/, "");
    })();

    function withBasePath(path) {
      if (!path || !path.startsWith("/")) return path;
      if (appBasePath && path.startsWith(`${appBasePath}/`)) return path;
      return `${appBasePath}${path}`;
    }

    function getAppPathname() {
      let path = window.location.pathname;
      if (appBasePath && path.startsWith(`${appBasePath}/`)) {

                        "contentHtml": "<section id=\"purpose-and-scenarios-h-0-что-представляет-собой-система\"><h2>Что представляет собой система</h2>\n<p>Цифровой двойник 2.0 объединяет карту, 3D-сцену, тематические слои, карточки объектов и инструменты подготовки материалов в одном интерфейсе. Пользователь работает не с абстрактной базой данных, а с территорией города: можно перейти к конкретному адресу, включить нужные данные, сравнить объект с окружением и собрать результат в рабочий контекст.</p>\n</section>\n<section id=\"purpose-and-scenarios-h-1-какие-задачи-решает-продукт\"><h3>Какие задачи решает продукт</h3>\n<p>Система особенно полезна там, где важен пространственный контекст. Через неё можно быстро проверить расположение объекта, оценить район вокруг, показать инфраструктуру, понять, какие данные доступны по территории, и подготовить единый набор материалов для последующего обсуждения. Это помогает сократить время на поиск данных в разных системах и снизить риск того, что участники совещания будут смотреть на разные версии информации.</p>\n</section>\n<section id=\"purpose-and-scenarios-h-2-когда-пользователю-стоит-открывать-цифровой-двой\"><h2>Когда пользователю стоит открывать Цифровой двойник 2.0</h2>\n<p>Запускайте систему, когда нужно:</p>\n<ul><li>найти и показать конкретный объект на карте;</li><li>проверить территорию перед звонком, встречей или совещанием;</li><li>включить слои по теме задачи и быстро оценить окружение;</li><li>открыть карточку объекта и посмотреть атрибуты или документы;</li><li>сохранить удачную конфигурацию работы для повторного использования.</li></ul>\n<p>Такая логика особенно полезна в ситуациях, когда решение зависит не только от самого объекта, но и от того, что находится рядом, какие ограничения есть на территории и как объект выглядит в общем городском контексте.</p>\n</section>\n<section id=\"purpose-and-scenarios-h-3-основные-сценарии-работы\"><h2>Основные сценарии работы</h2>\n<p>На практике чаще всего используются четыре сценария. Первый — обзорный: пользователь открывает карту, находит адрес, включает 1–3 базовых слоя и получает общее понимание ситуации. Второй — уточняющий: из найденного объекта открывается карточка, после чего пользователь проверяет атрибуты, документы или связанные сущности. Третий — демонстрационный: настраивается вид карты и 3D-сцены, включаются слои и готовится последовательность показа. Четвёртый — повторяемый: подготовленный контекст сохраняется в рабочем столе или в наборе пресетов.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Сценарии использования Цифрового двойника 2.0 на главной рабочей области</figcaption></figure>\n</section>\n<section id=\"purpose-and-scenarios-h-4-что-считается-успешным-результатом\"><h3>Что считается успешным результатом</h3>\n<p>Успешной работой считается ситуация, когда пользователь без переключения в сторонние инструменты смог найти территорию, включить нужные данные, понять контекст и сохранить или показать результат. Если после работы остаётся понятный рабочий набор слоёв, объектов и ракурсов, значит продукт использован по назначению.</p>\n</section>\n<section id=\"purpose-and-scenarios-h-5-что-система-не-заменяет\"><h2>Что система не заменяет</h2>\n<p>Цифровой двойник 2.0 не подменяет полноценный документооборот, детальную правовую экспертизу и внешние отраслевые системы, где хранятся первичные согласования или специализированные расчёты. Если задача требует юридически значимого документа, утверждённой схемы или официальной выгрузки из другого контура, используйте Цифровой двойник 2.0 как рабочую точку входа и инструмент визуального анализа, а не как единственный источник финального решения.</p>\n</section>\n<section id=\"purpose-and-scenarios-h-6-частые-ожидания-и-типовые-ошибки-на-старте\"><h2>Частые ожидания и типовые ошибки на старте</h2>\n<p>Новые пользователи часто ожидают, что любой объект будет иметь полную карточку, все слои будут доступны сразу, а 3D-сцена всегда покажет максимально детализированную картину. На практике наполнение зависит от вашей роли, доступов, конкретного контура и темы данных. Если нужный слой не отображается или карточка объекта выглядит неполной, это не обязательно ошибка системы: сначала проверьте права доступа, масштаб карты и включённые фильтры.</p>\n</section>"

                        "contentHtml": "<section id=\"interface-zones-h-0-из-каких-зон-состоит-интерфейс\"><h2>Из каких зон состоит интерфейс</h2>\n<p>Рабочий экран обычно делится на несколько устойчивых областей. В центре находится карта или 3D-сцена — это основное пространство просмотра. По краям располагаются панели поиска, дерева слоёв, карточек объектов, инструментов и служебных меню. В верхней части чаще всего находится строка навигации или быстрые действия, а в нижней либо боковой части — дополнительные виджеты, связанные с масштабом, режимами отображения или состоянием рабочей области.</p>\n</section>\n<section id=\"interface-zones-h-1-как-читать-экран-с-первого-взгляда\"><h3>Как читать экран с первого взгляда</h3>\n<p>Если вы открыли систему впервые, ориентируйтесь так: сначала найдите центральную карту, затем кнопку поиска, затем переключатель слоёв. После этого обратите внимание на область, где появляются карточки объектов или панели сценариев. Этого достаточно, чтобы выполнить базовый путь: найти территорию, включить данные, открыть объект и вернуть систему в исходный вид.</p>\n</section>\n<section id=\"interface-zones-h-2-где-пользователь-выполняет-основные-действия\"><h2>Где пользователь выполняет основные действия</h2>\n<p>Почти вся повседневная работа укладывается в четыре зоны:</p>\n<ul><li>поиск — для перехода к адресу, территории или объекту;</li><li>карта и 3D-сцена — для просмотра и навигации;</li><li>дерево слоёв — для включения и отключения данных;</li><li>карточки и панели сценариев — для изучения сведений и подготовки материалов.</li></ul>\n<p>Такое устройство помогает не теряться в интерфейсе. Даже если отдельные кнопки расположены чуть иначе, сами функции обычно находятся именно в этих четырёх логических зонах.</p>\n</section>\n<section id=\"interface-zones-h-3-как-открываются-и-закрываются-панели\"><h2>Как открываются и закрываются панели</h2>\n<p>Панели могут быть закреплёнными или плавающими. Закреплённые панели занимают устойчивое место в интерфейсе и раскрываются по нажатию на иконку меню или вкладку. Плавающие панели появляются поверх карты и могут закрываться крестиком, кнопкой «Назад» или повторным нажатием на управляющий элемент. Если после нескольких действий экран стал перегруженным, закройте лишние панели и оставьте только карту и одну рабочую область, например дерево слоёв или карточку объекта.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Основные зоны интерфейса на рабочем экране</figcaption></figure>\n</section>\n<section id=\"interface-zones-h-4-что-пользователь-видит-при-правильной-работе\"><h3>Что пользователь видит при правильной работе</h3>\n<p>Если интерфейс работает в штатном режиме, после открытия панели её содержимое появляется поверх или рядом с картой, не блокируя полностью обзор территории. Карта остаётся доступной для навигации, а закрытие панели возвращает пользователя в предыдущий контекст без потери положения камеры и выбранной территории.</p>\n</section>\n<section id=\"interface-zones-h-5-как-не-потерять-контекст-во-время-работы\"><h2>Как не потерять контекст во время работы</h2>\n<p>Переходы между разделами могут сбивать начинающего пользователя, если он открывает сразу несколько панелей. Чтобы не потерять контекст, полезно придерживаться простого правила: одна задача — одна активная панель. Например, при поиске используйте только строку поиска и карту, при изучении объекта — карточку объекта и карту, при включении тематических данных — дерево слоёв и карту. Так легче понять, что именно вызвало изменение на экране.</p>\n</section>\n<section id=\"interface-zones-h-6-типовые-затруднения\"><h2>Типовые затруднения</h2>\n<p>Если пользователь не понимает, почему объект исчез с экрана, обычно причина в одном из трёх факторов: слишком сильно изменён масштаб, панель перекрывает зону просмотра или включён другой режим отображения. Если неясно, где искать функцию, лучше сначала вернуться к карте, закрыть второстепенные панели и заново открыть только нужный раздел. Такой способ почти всегда быстрее, чем пытаться восстановить логику из перегруженного экрана.</p>\n</section>"
                  },

                        "contentHtml": "<section id=\"roles-and-permissions-h-0-почему-в-системе-есть-ролевой-доступ\"><h2>Почему в системе есть ролевой доступ</h2>\n<p>Цифровой двойник 2.0 работает с данными разной чувствительности и разного назначения. Поэтому интерфейс может показывать одинаковую карту, но разные наборы слоёв, карточек, инструментов и материалов для разных ролей. Это сделано для того, чтобы пользователь видел только те данные, которые нужны ему по рабочей функции и разрешены в его контуре.</p>\n</section>\n<section id=\"roles-and-permissions-h-1-какие-различия-заметны-сразу\"><h3>Какие различия заметны сразу</h3>\n<p>Чаще всего роль влияет на три вещи: список доступных разделов, глубину карточек объектов и состав тематических слоёв. Один пользователь увидит только базовые общедоступные данные, другой — расширенную карточку объекта с документами и материалами, а третий — дополнительные рабочие инструменты, например подготовку совещаний или публикацию рабочих столов.</p>\n</section>\n<section id=\"roles-and-permissions-h-2-типовые-роли-в-рабочем-контуре\"><h2>Типовые роли в рабочем контуре</h2>\n<p>Даже если в вашей организации роли называются иначе, почти всегда есть несколько уровней доступа:</p>\n<ul><li>базовый пользователь — работает с картой, поиском, общими слоями и стандартными карточками;</li><li>пользователь с расширенным доступом — видит дополнительные атрибуты, тематические слои, связанные материалы и инструменты подготовки;</li><li>владелец или администратор рабочего пространства — управляет сохранёнными наборами, доступами и публикацией результатов.</li></ul>\n<p>Такое деление полезно помнить, когда вы сравниваете свой экран с экраном коллеги. Не все отличия означают ошибку — иногда это просто другой уровень прав.</p>\n</section>\n<section id=\"roles-and-permissions-h-3-как-понять-что-функция-недоступна-по-роли\"><h2>Как понять, что функция недоступна по роли</h2>\n<p>Недоступность может проявляться по-разному. Иногда кнопка отсутствует совсем. Иногда она видна, но неактивна. В других случаях раздел открывается, но внутри отображается заглушка, отсутствие данных или сообщение о нехватке прав. Если функция критична для работы, важно не обходить ограничение вручную, а проверить, действительно ли она нужна по вашему сценарию и входит ли в ваш набор полномочий.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Пример различий в доступности функций для разных ролей</figcaption></figure>\n</section>\n<section id=\"roles-and-permissions-h-4-что-делать-если-коллега-видит-больше\"><h3>Что делать, если коллега видит больше</h3>\n<p>Сначала сравните не только экран, но и сценарий. Возможно, вы открыли другой объект или работаете на другом масштабе карты. Если различие системное и повторяется, запишите, какой раздел, слой или карточка недоступны, после чего обратитесь к администратору или ответственному за доступы. Чем точнее вы опишете проблему, тем быстрее её смогут проверить.</p>\n</section>\n<section id=\"roles-and-permissions-h-5-ограничения-связанные-с-правами\"><h2>Ограничения, связанные с правами</h2>\n<p>Некоторые действия могут быть доступны только в определённом контуре, с корпоративной сети или в конкретное время обновления данных. Кроме того, даже при наличии доступа часть объектов может оставаться без подробных материалов, если они ещё не загружены или не связаны с карточкой. Поэтому наличие роли не гарантирует одинаковую полноту всех записей в системе.</p>\n</section>\n<section id=\"roles-and-permissions-h-6-рекомендации-для-повседневной-работы\"><h2>Рекомендации для повседневной работы</h2>\n<p>Не ориентируйтесь только на скриншоты коллег. Гораздо надёжнее пользоваться логикой сценария: найти объект, включить слой, открыть карточку, проверить наличие дополнительных вкладок и попытаться сохранить рабочий результат. Если на одном из шагов интерфейс ведёт себя иначе, зафиксируйте точку расхождения и уже после этого уточняйте вопрос по доступам.</p>\n</section>"

                        "contentHtml": "<section id=\"request-access-h-0-когда-требуется-оформление-доступа\"><h2>Когда требуется оформление доступа</h2>\n<p>Доступ оформляется в тех случаях, когда пользователь впервые начинает работать с продуктом, меняет подразделение, получает новую роль или переводится на задачи, где нужны дополнительные данные. Формально вход в систему может выглядеть просто, но без правильно назначенной роли вы увидите только часть функций или вообще не сможете пройти внутрь.</p>\n</section>\n<section id=\"request-access-h-1-что-подготовить-до-подачи-заявки\"><h3>Что подготовить до подачи заявки</h3>\n<p>Обычно заранее нужны четыре вещи: рабочая учётная запись, подразделение, описание своей задачи и понимание, к каким именно разделам требуется доступ. Чем точнее вы сформулируете, что именно собираетесь делать в системе, тем легче согласовать права. Формулировка вроде «нужен полный доступ ко всему» почти всегда замедляет обработку.</p>\n</section>\n<section id=\"request-access-h-2-как-правильно-описать-потребность\"><h2>Как правильно описать потребность</h2>\n<p>В заявке лучше указывать не только название продукта, но и сценарий использования. Например: просмотр территорий по обращениям, анализ объектов с карточками, подготовка совещаний, работа с рабочими столами или включение тематических слоёв. Если нужны дополнительные материалы по объектам или совместная работа, это также стоит указать отдельно. Такой подход помогает выдать не минимальные и не избыточные права, а ровно те, которые нужны для работы.</p>\n</section>\n<section id=\"request-access-h-3-как-проходит-согласование\"><h2>Как проходит согласование</h2>\n<p>В типовом процессе заявка проходит проверку у администратора или владельца продукта, а в некоторых организациях — ещё и у руководителя направления. На этом этапе могут уточнять подразделение, должность, цель доступа и предполагаемый срок использования. Если право нужно временно, лучше указывать это сразу: временные доступы обычно обрабатываются быстрее и позже легче пересматриваются.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Пример формы или маршрута согласования доступа к Цифровому двойнику 2.0</figcaption></figure>\n</section>\n<section id=\"request-access-h-4-как-понять-что-доступ-выдан\"><h3>Как понять, что доступ выдан</h3>\n<p>После обработки заявки пользователь обычно получает уведомление, письмо или внутреннее сообщение с подтверждением. Иногда отдельного письма нет, и признаком успешной выдачи становится возможность войти в систему и увидеть нужные разделы. Если вход проходит, но сценарий всё равно недоступен, возможно, выдан базовый, а не расширенный набор прав.</p>\n</section>\n<section id=\"request-access-h-5-что-делать-после-получения-доступа\"><h2>Что делать после получения доступа</h2>\n<p>Не откладывайте первую проверку. Сразу после выдачи доступа откройте систему, выполните базовый вход, проверьте поиск, карту, дерево слоёв и одну типовую карточку объекта. Если у вас должна быть работа с совещаниями или рабочими столами, проверьте и эти разделы. Ошибки, обнаруженные в первый день, проще исправить, чем вопросы, поднятые уже перед важным показом.</p>\n</section>\n<section id=\"request-access-h-6-частые-ошибки-при-оформлении\"><h2>Частые ошибки при оформлении</h2>\n<p>Самые частые проблемы — неполное описание задачи, указание неверного подразделения, ожидание доступа к закрытым данным без дополнительного согласования и отсутствие первой проверки после выдачи. Чтобы избежать задержек, не ограничивайтесь фразой «для работы в продукте»: всегда уточняйте, какой именно сценарий вам нужен.</p>\n</section>"

                        "contentHtml": "<section id=\"first-login-h-0-что-проверить-до-первого-запуска\"><h2>Что проверить до первого запуска</h2>\n<p>Перед первым входом убедитесь, что используете поддерживаемый браузер, находитесь в нужном контуре доступа и входите под правильной рабочей учётной записью. Если в организации есть разделение между обычным и защищённым контуром, важно сразу открыть правильную ссылку. Неправильный адрес входа часто выглядит как «система не работает», хотя проблема связана только с маршрутом доступа.</p>\n</section>\n<section id=\"first-login-h-1-как-проходит-первый-вход\"><h3>Как проходит первый вход</h3>\n<p>В типовом случае пользователь переходит по рабочей ссылке, выполняет авторизацию через корпоративную учётную запись или выданные данные и попадает на главную рабочую область. После этого система может предложить подтвердить профиль, принять базовые условия использования или дождаться первичной загрузки интерфейса.</p>\n</section>\n<section id=\"first-login-h-2-что-увидеть-на-экране-после-входа\"><h2>Что увидеть на экране после входа</h2>\n<p>Правильный первый вход обычно заканчивается появлением главной рабочей области: карты, меню, панели поиска и доступных разделов. Если экран пустой, долго загружается или показывает только служебное сообщение, сначала обновите страницу один раз. Если это не помогает, проверьте сеть, роль и сам контур доступа.</p>\n</section>\n<section id=\"first-login-h-3-как-проверить-что-права-применились\"><h2>Как проверить, что права применились</h2>\n<p>После входа не ограничивайтесь фактом авторизации. Проверьте хотя бы три точки:</p>\n<ul><li>открывается ли карта;</li><li>работает ли поиск по адресу или объекту;</li><li>отображаются ли ваши основные разделы, например слои, карточки или рабочие столы.</li></ul>\n<p>Если у вас есть расширенные права, дополнительно проверьте 1–2 функции, ради которых доступ оформлялся: расширенную карточку объекта, совещания, рабочие столы или тематические слои.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Первый вход в систему и отображение главной рабочей области</figcaption></figure>\n</section>\n<section id=\"first-login-h-4-что-делать-с-настройками-профиля\"><h3>Что делать с настройками профиля</h3>\n<p>Если в системе есть профиль пользователя, сразу проверьте имя, подразделение, роль и служебные параметры, которые видны на экране. Это не косметическая проверка: ошибки в профиле могут объяснить, почему часть сценариев недоступна. Если данные отображаются неверно, лучше сразу зафиксировать проблему, а не ждать, пока она проявится в критический момент.</p>\n</section>\n<section id=\"first-login-h-5-как-понять-что-старт-прошeл-успешно\"><h2>Как понять, что старт прошёл успешно</h2>\n<p>Первый вход можно считать успешным, если пользователь без ошибок открывает карту, находит хотя бы один объект, видит доступные разделы и может закрыть и снова открыть систему без потери доступа. Это базовый минимум. Если хотя бы одна часть не работает, дальнейшее изучение лучше отложить и сначала восстановить корректный вход.</p>\n</section>\n<section id=\"first-login-h-6-типовые-проблемы-первого-запуска\"><h2>Типовые проблемы первого запуска</h2>\n<p>На первом входе чаще всего возникают три проблемы: открывается не тот контур, роль ещё не применена полностью или браузер блокирует отдельные элементы интерфейса. Реже проблема связана с сетевыми ограничениями. Если в первый день вход то работает, то нет, не продолжайте работу «как получится» — зафиксируйте точное время, шаги и сообщение системы, это сильно ускорит разбор.</p>\n</section>"

                        "contentHtml": "<section id=\"auth-errors-h-0-как-отличить-ошибку-входа-от-ошибки-прав\"><h2>Как отличить ошибку входа от ошибки прав</h2>\n<p>Проблемы доступа делятся на два типа. Первый — пользователь вообще не может войти: не проходит авторизация, появляется сообщение об ошибке или происходит циклический возврат на страницу входа. Второй — вход успешный, но внутри системы отсутствуют нужные разделы, слои или карточки. Эти два случая похожи для начинающего пользователя, но проверяются по-разному, поэтому важно различать их с самого начала.</p>\n</section>\n<section id=\"auth-errors-h-1-признаки-именно-ошибки-авторизации\"><h3>Признаки именно ошибки авторизации</h3>\n<p>К ошибкам авторизации относятся:</p>\n<ul><li>неверный логин или пароль;</li><li>ошибка единого входа;</li><li>устаревшая или прерванная сессия;</li><li>блокировка доступа по сети или политике безопасности;</li><li>постоянный возврат на стартовую страницу без открытия рабочей области.</li></ul>\n<p>В этих случаях бессмысленно искать нужный слой или объект: сначала нужно восстановить сам вход.</p>\n</section>\n<section id=\"auth-errors-h-2-признаки-ошибки-прав-или-ограничений-роли\"><h2>Признаки ошибки прав или ограничений роли</h2>\n<p>Если система открывается, но не показывает ожидаемую функцию, вероятнее всего дело в правах. Например, пользователь видит карту, но не видит раздел совещаний; может искать объекты, но не видит расширенные карточки; открывает слой, но не получает фактических данных. Часто это связано с ролью, дополнительным согласованием или тем, что конкретный набор данных разрешён только определённой группе пользователей.</p>\n</section>\n<section id=\"auth-errors-h-3-пошаговая-проверка-при-проблеме\"><h2>Пошаговая проверка при проблеме</h2>\n<p>Последовательность действий лучше делать именно такой:</p>\n<ul><li>откройте систему в новой сессии браузера;</li><li>убедитесь, что вход выполнен под нужной учётной записью;</li><li>проверьте, открывается ли главная рабочая область;</li><li>найдите, отсутствует ли именно функция, раздел или данные внутри раздела;</li><li>зафиксируйте точное сообщение или симптом.</li></ul>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Примеры сообщений об ошибке авторизации и ограничении прав</figcaption></figure>\n</section>\n<section id=\"auth-errors-h-4-какие-сведения-полезно-передать-в-поддержку\"><h3>Какие сведения полезно передать в поддержку</h3>\n<p>Лучше всего помогают такие данные: время проблемы, адрес страницы, шаг до ошибки, точный текст сообщения, ваш сценарий и ожидаемый результат. Если проблема связана с отсутствием данных, укажите название раздела, слой, объект или карточку. Сообщение «ничего не работает» почти всегда приводит к лишним уточнениям и задержкам.</p>\n</section>\n<section id=\"auth-errors-h-5-что-не-стоит-делать-самостоятельно\"><h2>Что не стоит делать самостоятельно</h2>\n<p>Не пытайтесь тестировать доступ через чужую учётную запись, обходить ограничения, многократно переоформлять заявку или отправлять расплывчатые запросы сразу в несколько каналов. Это создаёт шум и затрудняет диагностику. Намного полезнее один раз точно описать проблему и приложить скриншот или последовательность шагов.</p>\n</section>\n<section id=\"auth-errors-h-6-когда-проблема-считается-решeнной\"><h2>Когда проблема считается решённой</h2>\n<p>Считать проблему закрытой можно только после повторной проверки именно вашего сценария. Если вам открыли вход, но вы так и не увидели необходимый раздел, вопрос не решён. Если вернулся раздел, но внутри по-прежнему нет целевых данных, это тоже повод для повторной проверки. Итогом должна быть не формальная авторизация, а возможность выполнить нужную рабочую задачу от начала до конца.</p>\n</section>"

                        "contentHtml": "<section id=\"first-session-h-0-с-чего-начинать-первый-рабочий-сеанс\"><h2>С чего начинать первый рабочий сеанс</h2>\n<p>После входа не открывайте сразу все панели подряд. Первые минуты лучше посвятить короткому обзору: убедиться, что карта отображается, найти поиск, открыть дерево слоёв и проверить, где появляются карточки объектов. Это создаёт опорную схему интерфейса, благодаря которой дальнейшая работа идёт быстрее и спокойнее.</p>\n</section>\n<section id=\"first-session-h-1-какой-минимальный-маршрут-стоит-пройти\"><h3>Какой минимальный маршрут стоит пройти</h3>\n<p>Для первого сеанса достаточно сделать пять действий:</p>\n<ul><li>открыть карту и дождаться полной загрузки;</li><li>выполнить один поиск по адресу или объекту;</li><li>включить один понятный вам слой;</li><li>открыть карточку любого найденного объекта;</li><li>вернуть экран в чистое состояние.</li></ul>\n<p>Этого минимального маршрута достаточно, чтобы убедиться, что продукт доступен, а основной сценарий работает.</p>\n</section>\n<section id=\"first-session-h-2-как-выбрать-первую-задачу\"><h2>Как выбрать первую задачу</h2>\n<p>Не начинайте знакомство со сложного совещания или насыщенного набора слоёв. Лучше выбрать территорию, которую вы хорошо знаете: свой рабочий район, знакомый объект или адрес, по которому недавно была задача. Когда вы уже понимаете ожидаемый результат, легче заметить, правильно ли ведёт себя система и где именно возникает затруднение.</p>\n</section>\n<section id=\"first-session-h-3-как-проверить-что-рабочая-область-готова\"><h2>Как проверить, что рабочая область готова</h2>\n<p>Экран можно считать готовым к работе, если:</p>\n<ul><li>карта реагирует на перемещение и масштабирование;</li><li>поиск возвращает понятный результат;</li><li>панель слоёв раскрывается без ошибок;</li><li>карточка объекта открывается в отдельной области или панели;</li><li>после закрытия панелей карта не «ломается» и не пропадает.</li></ul>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Минимальный маршрут быстрого старта после входа в систему</figcaption></figure>\n</section>\n<section id=\"first-session-h-4-что-пользователь-видит-при-корректном-старте\"><h3>Что пользователь видит при корректном старте</h3>\n<p>После успешного базового маршрута пользователь понимает, где находятся основные инструменты, может осознанно повторить свои действия и не путает карту, слои, поиск и карточки. Это важнее, чем знать все функции наизусть: цель быстрого старта — дать опору, а не исчерпывающее знание продукта.</p>\n</section>\n<section id=\"first-session-h-5-какие-действия-стоит-отложить\"><h2>Какие действия стоит отложить</h2>\n<p>На первом сеансе не стоит сразу собирать рабочие столы, настраивать сложные пресеты, открывать длинные демонстрации или включать большое число слоёв одновременно. Эти действия полезны позже, когда базовая навигация уже не вызывает затруднений. Иначе любая мелкая ошибка будет казаться большой проблемой.</p>\n</section>\n<section id=\"first-session-h-6-частые-ошибки-первых-минут-работы\"><h2>Частые ошибки первых минут работы</h2>\n<p>Пользователь часто начинает с хаотичного открытия разделов, из-за чего теряет ориентиры. Вторая распространённая ошибка — попытка анализировать данные на слишком общем масштабе. Третья — вывод, что «ничего не отображается», когда проблема на самом деле связана с невключённым слоем или закрытой карточкой. Если чувствуете перегрузку, вернитесь к минимальному маршруту из пяти действий и пройдите его заново.</p>\n</section>"

                        "contentHtml": "<section id=\"basic-navigation-h-0-что-включает-базовая-навигация\"><h2>Что включает базовая навигация</h2>\n<p>Базовая навигация — это не только перемещение по карте. Под ней понимается умение менять масштаб, возвращаться к предыдущему положению, открывать и закрывать панели, не теряя выбранную территорию, и быстро понимать, какая часть интерфейса сейчас активна. Когда эта привычка сформирована, остальные функции осваиваются значительно быстрее.</p>\n</section>\n<section id=\"basic-navigation-h-1-как-не-запутаться-в-активных-панелях\"><h3>Как не запутаться в активных панелях</h3>\n<p>Каждый раз, когда вы открываете новый раздел, задавайте себе вопрос: что сейчас главное — карта, слой, поиск или карточка объекта. Если главное — карта, панели должны помогать, а не отвлекать. Если главное — карточка, не открывайте рядом ещё три панели. Простое ограничение по активным элементам сильно снижает количество случайных ошибок.</p>\n</section>\n<section id=\"basic-navigation-h-2-как-перемещаться-по-экрану-без-потери-точки\"><h2>Как перемещаться по экрану без потери точки</h2>\n<p>Во время анализа территории полезно менять положение камеры постепенно, а не делать резкие переходы между несвязанными масштабами. Если нужно уйти далеко от текущей зоны, сначала завершите текущий сценарий: закройте ненужные панели, посмотрите, какой слой активен, и только потом переходите к следующей точке. Это особенно важно при работе на совещании или при демонстрации коллегам.</p>\n</section>\n<section id=\"basic-navigation-h-3-как-возвращаться-к-понятному-виду\"><h2>Как возвращаться к понятному виду</h2>\n<p>Если экран стал перегруженным, используйте базовую стратегию восстановления:</p>\n<ul><li>закройте второстепенные панели;</li><li>вернитесь к карте;</li><li>проверьте масштаб;</li><li>отключите временные слои;</li><li>заново откройте только нужный инструмент.</li></ul>\n<p>Такой подход быстрее и надёжнее, чем пытаться вручную разбираться, какая именно мелкая настройка привела к неудобному виду.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Базовая навигация между картой, панелями и карточками объектов</figcaption></figure>\n</section>\n<section id=\"basic-navigation-h-4-что-должно-получаться-у-уверенного-пользователя\"><h3>Что должно получаться у уверенного пользователя</h3>\n<p>Уверенный пользователь без напряжения переключается между поиском, картой, слоями и карточкой объекта. Он понимает, где находится его текущий контекст, и может быстро вернуться к рабочему виду после любого неудачного действия. Это хороший ориентир: если вы уже умеете это делать, значит быстрый старт пройден.</p>\n</section>\n<section id=\"basic-navigation-h-5-когда-навигация-кажется-сломавшейся\"><h2>Когда навигация кажется «сломавшейся»</h2>\n<p>Обычно это не поломка, а сочетание неудобного масштаба, открытых панелей и включённых режимов. Иногда карта «зависает» визуально, хотя на самом деле пользователь просто оказался на неподходящем уровне масштаба. В таких случаях помогает последовательный возврат: сначала очистить экран, потом восстановить масштаб, затем снова включить только нужные данные.</p>\n</section>\n<section id=\"basic-navigation-h-6-полезная-привычка-для-ежедневной-работы\"><h2>Полезная привычка для ежедневной работы</h2>\n<p>Старайтесь завершать каждую короткую задачу в чистом состоянии. Закрыли карточку — проверьте карту. Закончили со слоями — вернитесь к основному виду. Показали коллегам объект — уберите временные панели. Благодаря такой привычке следующий сценарий всегда начинается из предсказуемой точки.</p>\n</section>"

                        "contentHtml": "<section id=\"restore-work-state-h-0-что-считается-рабочим-состоянием\"><h2>Что считается рабочим состоянием</h2>\n<p>Под рабочим состоянием в этой статье понимается такой вид системы, при котором пользователь снова понимает, где находится карта, какие слои включены, какой объект выбран и какая панель активна. Это не обязательно начальный экран. Главное — чтобы текущая рабочая ситуация была прозрачной и управляемой.</p>\n</section>\n<section id=\"restore-work-state-h-1-симптомы-потери-рабочего-состояния\"><h3>Симптомы потери рабочего состояния</h3>\n<p>Обычно о проблеме говорят такие признаки:</p>\n<ul><li>на экране открыто слишком много панелей;</li><li>объект найти не удаётся, хотя он только что был на карте;</li><li>включённые слои дают неожиданный результат;</li><li>карта отдалилась или повернулась так, что сложно понять положение;</li><li>непонятно, какая панель сейчас управляет сценой.</li></ul>\n</section>\n<section id=\"restore-work-state-h-2-быстрый-способ-восстановить-контроль\"><h2>Быстрый способ восстановить контроль</h2>\n<p>Используйте короткий маршрут восстановления:</p>\n<ul><li>закройте второстепенные панели;</li><li>верните карту к спокойному масштабу;</li><li>отключите временно включённые слои;</li><li>снимите выделение с объекта, если оно мешает;</li><li>заново запустите нужный сценарий.</li></ul>\n<p>Этот путь полезен и в одиночной работе, и во время демонстрации, когда нужно быстро вернуть понятный вид без долгих объяснений.</p>\n</section>\n<section id=\"restore-work-state-h-3-когда-стоит-использовать-сохранeнные-контексты\"><h2>Когда стоит использовать сохранённые контексты</h2>\n<p>Если вы часто возвращаетесь к одним и тем же территориям или наборам данных, лучше заранее сохранить рабочий стол или пресет, а не пытаться каждый раз вручную восстанавливать нужную комбинацию. Это особенно важно перед совещаниями: заранее сохранённый контекст значительно снижает риск ошибок в момент показа.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Возврат к рабочему состоянию после перегруженного экрана</figcaption></figure>\n</section>\n<section id=\"restore-work-state-h-4-как-понять-что-восстановление-прошло-успешно\"><h3>Как понять, что восстановление прошло успешно</h3>\n<p>Успешное восстановление — это ситуация, когда вы снова можете выполнить базовый маршрут: видеть карту, искать объект, включать слой и открывать карточку без неожиданного поведения интерфейса. Если это получилось, значит проблема устранима текущими средствами и не требует вмешательства поддержки.</p>\n</section>\n<section id=\"restore-work-state-h-5-когда-нужен-более-жeсткий-сброс\"><h2>Когда нужен более жёсткий сброс</h2>\n<p>Если после всех действий карта продолжает вести себя непредсказуемо, панель не закрывается или отображение явно сломано, можно обновить страницу или заново открыть систему. Но делать это стоит только после того, как вы попытались восстановить состояние внутри текущего сеанса. Иначе вы потеряете шанс понять, что именно вызвало проблему.</p>\n</section>\n<section id=\"restore-work-state-h-6-частые-ошибки-при-попытке-починить-всe-сразу\"><h2>Частые ошибки при попытке «починить всё сразу»</h2>\n<p>Самая распространённая ошибка — хаотично нажимать разные переключатели и одновременно двигать карту. Вторая — многократно обновлять страницу, не проверяя, что именно не так. Третья — не замечать, что проблема вызвана лишь одним включённым слоем или выбранным режимом. Лучше действовать последовательно: одна причина — одна проверка.</p>\n</section>"

                        "contentHtml": "<section id=\"move-and-zoom-h-0-зачем-нужен-контроль-масштаба\"><h2>Зачем нужен контроль масштаба</h2>\n<p>Карта в Цифровом двойнике 2.0 полезна только тогда, когда пользователь умеет выбирать правильный уровень приближения. На слишком общем масштабе трудно оценить объект и его окружение. На слишком крупном — легко потерять контекст района. Поэтому навигация по карте строится не на случайном приближении, а на осознанном переходе между уровнями обзора.</p>\n</section>\n<section id=\"move-and-zoom-h-1-как-выбирать-масштаб-под-задачу\"><h3>Как выбирать масштаб под задачу</h3>\n<p>Для первичного обзора используйте общий масштаб, на котором виден район и основные ориентиры. Для работы с конкретным объектом приближайтесь до уровня, где становится понятна связь объекта с ближайшей застройкой и дорогами. Для демонстрации конкретной площадки используйте такой масштаб, при котором зритель видит и сам объект, и важное окружение, а не только одну точку на карте.</p>\n</section>\n<section id=\"move-and-zoom-h-2-как-перемещаться-по-карте\"><h2>Как перемещаться по карте</h2>\n<p>Перемещение стоит делать короткими последовательными шагами. Сначала определите целевую территорию, затем приблизьтесь, потом скорректируйте положение карты так, чтобы основная площадка оказалась в центре. Если навигация слишком резкая, зрительно теряется логика анализа. Особенно это заметно на совещаниях, где аудитория должна успевать следить за сменой вида.</p>\n</section>\n<section id=\"move-and-zoom-h-3-как-не-потерять-исходную-территорию\"><h2>Как не потерять исходную территорию</h2>\n<p>Если вам нужно ненадолго отойти к соседнему объекту, не меняйте масштаб слишком сильно. Лучше сделать небольшое смещение по карте и затем вернуться обратно. Если задача выходит за пределы текущего района, используйте поиск, а не ручное перемещение через длинный маршрут: это быстрее и чище с точки зрения рабочего контекста.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Переход между общим, средним и детальным масштабом карты</figcaption></figure>\n</section>\n<section id=\"move-and-zoom-h-4-что-пользователь-видит-при-корректной-навигации\"><h3>Что пользователь видит при корректной навигации</h3>\n<p>Корректная навигация ощущается как предсказуемое поведение карты: объект остаётся в фокусе, карта двигается плавно, а смена масштаба помогает, а не запутывает. После 2–3 переходов вы по-прежнему понимаете, где находитесь и зачем выбрали именно такой уровень приближения.</p>\n</section>\n<section id=\"move-and-zoom-h-5-как-вернуть-удобный-вид\"><h2>Как вернуть удобный вид</h2>\n<p>Если карта ушла слишком далеко или, наоборот, слишком приблизилась, не пытайтесь сразу «нащупать» нужную точку случайными движениями. Лучше вернуться к поиску или к последнему понятному масштабу, а затем повторить приближение более уверенно. Такой способ особенно полезен, если вы показываете территорию не себе, а коллегам.</p>\n</section>\n<section id=\"move-and-zoom-h-6-частые-ошибки-навигации\"><h2>Частые ошибки навигации</h2>\n<p>Чаще всего пользователи:</p>\n<ul><li>анализируют данные на неподходящем масштабе;</li><li>слишком резко меняют уровень приближения;</li><li>уводят объект из центра экрана и потом теряют его;</li><li>забывают, что один и тот же слой может выглядеть по-разному в зависимости от масштаба.</li></ul>\n<p>Осознанная работа с масштабом сразу снижает все эти проблемы и делает карту понятным рабочим инструментом, а не просто фоном.</p>\n</section>"

                        "contentHtml": "<section id=\"search-objects-h-0-для-чего-нужен-поиск\"><h2>Для чего нужен поиск</h2>\n<p>Поиск в Цифровом двойнике 2.0 — это не вспомогательная мелочь, а основной способ начать работу с территорией. Вместо ручного перемещения по карте лучше сразу перейти к адресу, объекту или площадке через поисковую строку. Это экономит время и помогает избежать ошибок навигации, особенно если вы работаете с незнакомыми районами.</p>\n</section>\n<section id=\"search-objects-h-1-какие-запросы-обычно-работают-лучше\"><h3>Какие запросы обычно работают лучше</h3>\n<p>Наиболее предсказуемо работают точные адреса, устойчивые названия объектов и известные пользователю идентификаторы, если они поддерживаются контуром. Чем точнее формулировка, тем меньше лишних результатов. Если объект не находится с первой попытки, попробуйте упростить запрос: оставить только улицу и номер, название без уточняющих слов или часть официального наименования.</p>\n</section>\n<section id=\"search-objects-h-2-как-использовать-результаты-поиска\"><h2>Как использовать результаты поиска</h2>\n<p>После ввода запроса система обычно показывает список совпадений. Не выбирайте вариант автоматически, если у нескольких результатов похожие названия. Сначала сравните подсказки: район, тип объекта, адресную привязку. Только после этого переходите к нужной записи. Одна лишняя секунда на проверку почти всегда экономит больше времени, чем возврат с неправильной территории.</p>\n</section>\n<section id=\"search-objects-h-3-как-работать-после-перехода-к-объекту\"><h2>Как работать после перехода к объекту</h2>\n<p>Когда карта переведена к результату поиска, сделайте короткую проверку:</p>\n<ul><li>совпадает ли адрес или название;</li><li>соответствует ли окружение ожидаемой территории;</li><li>нужен ли дополнительный масштаб;</li><li>стоит ли сразу открыть карточку объекта;</li><li>нужно ли включить тематический слой.</li></ul>\n<p>Эта проверка превращает поиск из простого «прыжка» в полноценный вход в рабочий сценарий.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Поиск объекта с выбором результата из списка совпадений</figcaption></figure>\n</section>\n<section id=\"search-objects-h-4-что-делать-если-поиск-ничего-не-нашeл\"><h3>Что делать, если поиск ничего не нашёл</h3>\n<p>Сначала упростите запрос. Затем проверьте раскладку, сокращения и возможные варианты написания. Если система всё равно не находит запись, попробуйте искать по более общему ориентиру, а затем перейти к нужной точке уже на карте. Иногда причина не в ошибке пользователя, а в том, что объект отсутствует в доступном контуре данных или называется иначе.</p>\n</section>\n<section id=\"search-objects-h-5-как-понять-что-найден-именно-нужный-объект\"><h2>Как понять, что найден именно нужный объект</h2>\n<p>Убедитесь, что совпадают не только название, но и контекст: район, близлежащие улицы, окружающая застройка, а если доступна карточка — и базовые атрибуты. Особенно внимательно это нужно делать, когда система работает с типовыми названиями или когда в городе есть несколько объектов с похожими адресами.</p>\n</section>\n<section id=\"search-objects-h-6-частые-ошибки-поиска\"><h2>Частые ошибки поиска</h2>\n<p>Пользователи часто:</p>\n<ul><li>вводят слишком общий запрос и выбирают первый попавшийся результат;</li><li>не проверяют окружение после перехода;</li><li>считают отсутствие результата ошибкой системы, хотя запрос сформулирован неудачно;</li><li>продолжают искать ручным перемещением, хотя проще изменить формулировку запроса.</li></ul>\n<p>Правильная привычка — использовать поиск как точный старт сценария, а не как беспорядочный перебор вариантов.</p>\n</section>"

                        "contentHtml": "<section id=\"base-layers-and-modes-h-0-зачем-менять-режим-отображения\"><h2>Зачем менять режим отображения</h2>\n<p>Одна и та же территория может восприниматься по-разному в зависимости от подложки и режима показа. Для обзорной работы бывает достаточно базовой картографической схемы. Для оценки формы застройки или точного пространственного контекста полезнее переключиться на более детализированное отображение. Поэтому подложка — это рабочий инструмент, а не декоративная настройка.</p>\n</section>\n<section id=\"base-layers-and-modes-h-1-когда-какую-подложку-выбирать\"><h3>Когда какую подложку выбирать</h3>\n<p>Если задача — быстро ориентироваться по улицам, границам и общим контурам, используйте базовую картографическую подложку. Если нужно показать объект в визуально более реалистичном окружении, подойдёт детализированная или фотограмметрическая подложка. Для смешанного сценария полезен гибридный режим, где сохраняется и геометрия объекта, и читаемость карты.</p>\n</section>\n<section id=\"base-layers-and-modes-h-2-как-переключать-режим-без-потери-контекста\"><h2>Как переключать режим без потери контекста</h2>\n<p>Прежде чем менять подложку, зафиксируйте целевой объект на экране. Затем переключите режим и дождитесь, пока карта отрисуется полностью. Не делайте одновременно смену подложки, сильное масштабирование и включение нескольких тяжёлых слоёв: так труднее понять, что именно изменилось и почему экран стал менее удобным.</p>\n</section>\n<section id=\"base-layers-and-modes-h-3-что-учитывать-при-демонстрации\"><h2>Что учитывать при демонстрации</h2>\n<p>На совещании подложка должна помогать зрителю. Если на детализированном виде стало сложнее считывать подписи или границы, лучше вернуться к более чистому режиму. Если же обсуждается форма объекта, высотность или положение в тканях застройки, реалистичный режим даёт больше пользы, чем упрощённая карта.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Сравнение картографической, детализированной и гибридной подложек</figcaption></figure>\n</section>\n<section id=\"base-layers-and-modes-h-4-что-может-измениться-при-переключении\"><h3>Что может измениться при переключении</h3>\n<p>После смены режима часть слоёв может стать визуально заметнее или, наоборот, менее читаемой. Некоторые подписи и элементы интерфейса проявляются по-разному на разных подложках. Это не ошибка, а обычное следствие того, что визуальная база стала другой. Поэтому после переключения полезно быстро перепроверить читаемость результата.</p>\n</section>\n<section id=\"base-layers-and-modes-h-5-какой-результат-считать-удачным\"><h2>Какой результат считать удачным</h2>\n<p>Удачный выбор режима — это когда территория выглядит достаточно детально для вашей задачи, но при этом не теряется смысловая читаемость: можно понять улицы, границы, положение объекта и активные слои. Если после переключения стало красивее, но менее понятно, значит подложка выбрана неудачно.</p>\n</section>\n<section id=\"base-layers-and-modes-h-6-типовые-ошибки-при-работе-с-подложками\"><h2>Типовые ошибки при работе с подложками</h2>\n<p>Основные ошибки здесь простые: пользователь выбирает самый детальный режим всегда, не думая о задаче; переключает подложку в момент, когда и так происходят другие изменения; не проверяет читаемость подписей и слоёв после смены режима. Полезнее каждый раз задавать себе вопрос: что я хочу показать — схему, геометрию или общий контекст?</p>\n</section>"

                        "contentHtml": "<section id=\"cameras-on-map-h-0-для-чего-в-системе-используются-камеры\"><h2>Для чего в системе используются камеры</h2>\n<p>Камеры на карте помогают быстро перейти от абстрактной территории к визуально подтверждённой ситуации. Их используют, когда нужно понять положение точки наблюдения, проверить покрытие участка и связать местность с доступным видеопотоком или карточкой камеры, если такой сценарий разрешён в вашем контуре.</p>\n</section>\n<section id=\"cameras-on-map-h-1-когда-камеры-особенно-полезны\"><h3>Когда камеры особенно полезны</h3>\n<p>Этот сценарий уместен, когда вы оцениваете транспортный узел, точку входа, уличное пространство, участок дороги или территорию, где важен визуальный контроль. Камера дополняет карту: она не заменяет слои и карточки объектов, а даёт дополнительную точку наблюдения, привязанную к месту.</p>\n</section>\n<section id=\"cameras-on-map-h-2-как-найти-камеры-на-карте\"><h2>Как найти камеры на карте</h2>\n<p>Обычно камеры появляются после включения соответствующего слоя или режима. Далее пользователь переводит карту к интересующей территории, уточняет масштаб и взаимодействует с пиктограммами камер. Важно не спешить: на слишком общем масштабе пиковые зоны могут выглядеть перегруженно, а часть камер — сливаться между собой.</p>\n</section>\n<section id=\"cameras-on-map-h-3-как-открыть-связанную-информацию\"><h2>Как открыть связанную информацию</h2>\n<p>После выбора камеры система может показать карточку, краткие сведения, направление обзора или доступный просмотр. Последовательность зависит от вашего контура, но базовая логика одинакова: пользователь не просто выбирает точку на карте, а уточняет, какая именно камера нужна, что она покрывает и достаточно ли этой точки для текущей задачи.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Отображение камер видеонаблюдения на карте территории</figcaption></figure>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Карточка камеры или связанный просмотр после выбора точки наблюдения</figcaption></figure>\n</section>\n<section id=\"cameras-on-map-h-4-что-важно-учитывать-при-интерпретации\"><h3>Что важно учитывать при интерпретации</h3>\n<p>Камера показывает ситуацию только со своей точки обзора. Даже если на карте кажется, что участок рядом, в кадр он может попадать частично или не попадать вовсе. Поэтому при работе с камерами важно учитывать направление, высоту точки и реальное покрытие. Не делайте выводов только по положению пиктограммы на карте.</p>\n</section>\n<section id=\"cameras-on-map-h-5-как-понять-что-сценарий-выполнен-успешно\"><h2>Как понять, что сценарий выполнен успешно</h2>\n<p>Успешный результат — это когда пользователь нашёл нужную точку наблюдения, понимает её привязку к территории и смог использовать камеру как дополнение к анализу, а не как случайный визуальный элемент. Если после открытия камеры стало понятнее, как выглядит участок и что происходит в контролируемой зоне, сценарий выполнен правильно.</p>\n</section>\n<section id=\"cameras-on-map-h-6-частые-ошибки-при-работе-с-камерами\"><h2>Частые ошибки при работе с камерами</h2>\n<p>К типовым ошибкам относятся выбор камеры на слишком общем масштабе, ожидание полного видеодоступа там, где разрешена только карточка или положение камеры, и попытка оценивать покрытие без учёта направления обзора. Кроме того, камеры могут быть доступны не всем ролям, поэтому отсутствие детального просмотра не всегда означает поломку.</p>\n</section>"

                        "contentHtml": "<section id=\"tree-structure-h-0-зачем-пользователю-понимать-структуру-слоeв\"><h2>Зачем пользователю понимать структуру слоёв</h2>\n<p>Дерево слоёв — это основной способ подключать тематические данные к карте. Если воспринимать его как длинный список со случайными галочками, работа быстро становится неудобной. Но если видеть в нём иерархию тем и подтем, находить нужный набор данных становится значительно проще.</p>\n</section>\n<section id=\"tree-structure-h-1-что-обычно-скрывается-в-иерархии\"><h3>Что обычно скрывается в иерархии</h3>\n<p>В верхнем уровне чаще всего находятся крупные темы: территория, инфраструктура, объекты, транспорт, наблюдение, служебные данные и другие смысловые блоки. Ниже расположены подгруппы и отдельные слои. Такая структура помогает включать либо отдельные точечные данные, либо сразу тематический блок, если нужно быстро собрать общий вид по теме.</p>\n</section>\n<section id=\"tree-structure-h-2-как-читать-дерево-слоeв\"><h2>Как читать дерево слоёв</h2>\n<p>Начинайте не с разворачивания всего списка, а с выбора смыслового направления. Например, если вы работаете с территорией, сначала найдите тематический блок по нужной области, затем сузьте выбор до подгруппы, и только после этого переходите к конкретным слоям. Эта последовательность экономит время и помогает не перегружать карту лишними данными.</p>\n</section>\n<section id=\"tree-structure-h-3-чем-группа-отличается-от-отдельного-слоя\"><h2>Чем группа отличается от отдельного слоя</h2>\n<p>Группа — это контейнер для нескольких связанных наборов данных. Отдельный слой — это конкретный отображаемый набор. Если включить всю группу, можно быстро получить общий тематический обзор, но карта может стать слишком насыщенной. Если включать только отдельные слои, анализ будет точнее, но потребуется больше ручных действий. Выбор зависит от вашей задачи и времени.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Иерархия дерева слоёв с группами, подгруппами и отдельными слоями</figcaption></figure>\n</section>\n<section id=\"tree-structure-h-4-когда-полезно-раскрывать-дерево-глубже\"><h3>Когда полезно раскрывать дерево глубже</h3>\n<p>Глубокий просмотр дерева нужен тогда, когда общего названия темы недостаточно и требуется найти конкретный набор данных. Например, не просто «объекты», а определённый подвид объектов. В остальных случаях полезно удерживать дерево в компактном виде, чтобы не теряться в длинном списке.</p>\n</section>\n<section id=\"tree-structure-h-5-как-понять-что-слой-выбран-правильно\"><h2>Как понять, что слой выбран правильно</h2>\n<p>После включения слоя на карте должно появиться визуально понятное изменение: точки, контуры, подписи, зоны или другой ожидаемый тип данных. Если пользователь не видит изменений, сначала стоит проверить масштаб, а не предполагать, что слой пустой. Во многих случаях данные становятся заметны только на определённом уровне приближения.</p>\n</section>\n<section id=\"tree-structure-h-6-типовые-ошибки-при-работе-с-деревом\"><h2>Типовые ошибки при работе с деревом</h2>\n<p>Часто пользователи сразу раскрывают всё дерево, включают слишком много слоёв или не различают группу и отдельный слой. Из-за этого карта становится перегруженной, а причина каждого элемента на экране — неочевидной. Намного лучше включать данные постепенно и после каждого шага смотреть, какое изменение появилось на карте.</p>\n</section>"

                        "contentHtml": "<section id=\"filtering-and-legend-h-0-как-включать-слои-без-перегрузки-карты\"><h2>Как включать слои без перегрузки карты</h2>\n<p>Оптимальная практика — начинать с одного базового слоя и только потом добавлять уточняющие данные. Когда пользователь включает сразу пять-шесть тематик, он перестаёт понимать, какой слой отвечает за какой символ. По этой причине перед каждым включением полезно отвечать на простой вопрос: что именно этот слой должен добавить к уже видимому на экране?</p>\n</section>\n<section id=\"filtering-and-legend-h-1-в-каком-порядке-лучше-добавлять-данные\"><h3>В каком порядке лучше добавлять данные</h3>\n<p>Хорошая последовательность выглядит так:</p>\n<ul><li>сначала базовая подложка и территория;</li><li>затем один смысловой слой по текущей задаче;</li><li>после этого уточняющий слой;</li><li>в конце — временные или вспомогательные данные, если без них нельзя обойтись.</li></ul>\n<p>Так карта остаётся читаемой, а каждый новый элемент имеет понятную причину появления.</p>\n</section>\n<section id=\"filtering-and-legend-h-2-зачем-нужны-фильтры\"><h2>Зачем нужны фильтры</h2>\n<p>Фильтрация помогает не просто включить слой, а показать в нём только релевантные данные. Это особенно полезно, если слой содержит много объектов, а пользователю нужен один тип записей, один район, один статус или один рабочий срез. Правильно настроенный фильтр делает карту не только аккуратнее, но и полезнее по смыслу.</p>\n</section>\n<section id=\"filtering-and-legend-h-3-как-использовать-легенду\"><h2>Как использовать легенду</h2>\n<p>Легенда нужна для расшифровки того, что именно вы видите на экране: какие цвета, иконки, типы контуров или обозначения соответствуют разным состояниям данных. Пользователи часто пропускают легенду и начинают интерпретировать карту интуитивно, что приводит к ошибкам. Если слой новый или сложный, легенду нужно проверять обязательно.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Включение слоя, применение фильтра и чтение легенды</figcaption></figure>\n</section>\n<section id=\"filtering-and-legend-h-4-как-убедиться-что-фильтр-сработал\"><h3>Как убедиться, что фильтр сработал</h3>\n<p>После применения фильтра количество элементов на карте обычно меняется, а визуальный шум уменьшается. Если ничего не изменилось, проверьте, поддерживает ли текущий слой выбранный тип фильтра, есть ли данные в видимой территории и не конфликтуют ли между собой несколько активных условий.</p>\n</section>\n<section id=\"filtering-and-legend-h-5-какой-результат-считать-правильным\"><h2>Какой результат считать правильным</h2>\n<p>Результат можно считать правильным, если на карте остались только нужные вам объекты, а смысл их символов понятен по легенде. В таком состоянии карту удобно анализировать и показывать коллегам: зритель видит не все возможные данные, а именно те, которые относятся к текущему вопросу.</p>\n</section>\n<section id=\"filtering-and-legend-h-6-частые-ошибки-при-фильтрации\"><h2>Частые ошибки при фильтрации</h2>\n<p>Основные затруднения возникают в четырёх случаях: пользователь забывает, что фильтр уже включён; применяет фильтр не к тому слою; не читает легенду; ожидает, что слой покажет данные на любом масштабе. При странном результате сначала проверьте, активен ли фильтр, и только потом меняйте остальные параметры.</p>\n</section>"

                        "contentHtml": "<section id=\"layer-issues-h-0-почему-слой-может-не-отображаться\"><h2>Почему слой может не отображаться</h2>\n<p>Отсутствие слоя на карте не всегда означает проблему в данных. Чаще всего причина в масштабе, выключенной подгруппе, активном фильтре, неподходящей подложке или отсутствии прав. Поэтому проверку стоит делать по понятной цепочке, а не переключать всё подряд.</p>\n</section>\n<section id=\"layer-issues-h-1-первая-проверка-при-отсутствии-результата\"><h3>Первая проверка при отсутствии результата</h3>\n<p>Если слой включён, но вы ничего не видите, проверьте:</p>\n<ul><li>правильный ли выбран масштаб;</li><li>видите ли вы нужную территорию;</li><li>не включён ли ограничивающий фильтр;</li><li>доступен ли этот слой вашей роли;</li><li>нет ли конфликта с другими активными слоями.</li></ul>\n<p>Эта базовая последовательность закрывает большинство ситуаций без лишних действий.</p>\n</section>\n<section id=\"layer-issues-h-2-почему-слой-выглядит-иначе-чем-ожидалось\"><h2>Почему слой выглядит иначе, чем ожидалось</h2>\n<p>Даже корректно работающий слой может выглядеть по-разному на разных подложках и уровнях масштаба. Кроме того, часть данных может быть представлена условными знаками, а не полными контурами или подписями. Если вы сравниваете свой экран с чужим скриншотом, учитывайте, что разница вполне может объясняться другими условиями отображения.</p>\n</section>\n<section id=\"layer-issues-h-3-как-действовать-при-перегруженной-карте\"><h2>Как действовать при перегруженной карте</h2>\n<p>Если после включения слоя карта стала слишком шумной, не спешите отключать продукт целиком. Сначала выключите второстепенные данные, потом проверьте легенду и масштаб, а при необходимости примените фильтры. Часто проблема не в самом слое, а в его сочетании с другими активными данными.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Типовые причины, по которым слой не появляется на карте</figcaption></figure>\n</section>\n<section id=\"layer-issues-h-4-когда-стоит-обращаться-за-помощью\"><h3>Когда стоит обращаться за помощью</h3>\n<p>Обращение нужно, если слой стабильно отсутствует в ожидаемом сценарии, хотя масштаб, территория, фильтр и права проверены. То же касается случаев, когда слой отображается с явными визуальными ошибками или внезапно исчез для группы пользователей, у которых он раньше работал штатно.</p>\n</section>\n<section id=\"layer-issues-h-5-что-сообщать-при-разборе-проблемы\"><h2>Что сообщать при разборе проблемы</h2>\n<p>Полезно передать название слоя, свою роль, масштаб, территорию, активные фильтры и краткое описание ожидаемого результата. Если есть возможность, приложите скриншот до и после включения слоя. Чем точнее вы описываете контекст, тем быстрее можно понять, проблема это прав, данных, масштаба или интерфейса.</p>\n</section>\n<section id=\"layer-issues-h-6-какой-подход-снижает-риск-ошибок\"><h2>Какой подход снижает риск ошибок</h2>\n<p>Лучший способ — включать слои по одному, всегда проверять результат после каждого действия и не накапливать сразу несколько изменений. Тогда при любой аномалии вы быстро поймёте, какой именно шаг её вызвал, и сможете либо сами исправить ситуацию, либо корректно передать её на разбор.</p>\n</section>"

                        "contentHtml": "<section id=\"object-card-h-0-что-такое-карточка-объекта\"><h2>Что такое карточка объекта</h2>\n<p>Карточка объекта — это точка входа к сведениям о выбранной записи на карте. Она связывает карту с данными: из геометрии объекта пользователь получает доступ к наименованию, типу, адресу, статусу, связанным признакам и дополнительным действиям. Поэтому карточка полезна не сама по себе, а как продолжение сценария анализа территории.</p>\n</section>\n<section id=\"object-card-h-1-когда-карточку-стоит-открывать-обязательно\"><h3>Когда карточку стоит открывать обязательно</h3>\n<p>Есть три ситуации, когда карточка нужна почти всегда: когда вы не уверены, что нашли правильный объект; когда нужно подтвердить его основные атрибуты; когда необходим переход к связанным материалам или документам. Во всех этих случаях визуального положения на карте недостаточно.</p>\n</section>\n<section id=\"object-card-h-2-из-каких-частей-состоит-карточка\"><h2>Из каких частей состоит карточка</h2>\n<p>Обычно в карточке есть верхняя часть с названием и краткими признаками, основной блок с атрибутами, а также дополнительные вкладки или секции с материалами, связями и действиями. В некоторых контурах карточка показывает только базовый минимум, а дополнительные области зависят от роли пользователя и типа объекта.</p>\n</section>\n<section id=\"object-card-h-3-как-читать-карточку-без-лишней-прокрутки\"><h2>Как читать карточку без лишней прокрутки</h2>\n<p>Сначала проверьте верхнюю часть: название, тип и ключевые идентификаторы. Затем найдите адресную или территориальную привязку. После этого переходите к тем данным, которые нужны именно по текущему сценарию: статус, связанные материалы, документы или история изменений. Такой порядок быстрее, чем пытаться читать карточку сверху вниз без цели.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Базовая структура карточки объекта в рабочем интерфейсе</figcaption></figure>\n</section>\n<section id=\"object-card-h-4-как-соотносить-карточку-с-картой\"><h3>Как соотносить карточку с картой</h3>\n<p>Карточка всегда должна проверяться через карту, а карта — через карточку. Если на карте вам кажется, что это нужный объект, карточка должна подтвердить это по атрибутам. Если карточка выглядит правильной, карта должна показывать ожидаемое положение. Это простое правило снижает риск ошибочного выбора на территориях с плотной застройкой и похожими объектами.</p>\n</section>\n<section id=\"object-card-h-5-как-понять-что-карточка-полная-для-вашей-задачи\"><h2>Как понять, что карточка полная для вашей задачи</h2>\n<p>Карточку можно считать достаточной, если она отвечает на текущий вопрос: это нужный объект, он находится именно здесь, его ключевые характеристики подтверждаются, а при необходимости доступны связанные материалы. Если одного из этих пунктов не хватает, ищите дополнительные вкладки, связанные данные или уточняющие слои.</p>\n</section>\n<section id=\"object-card-h-6-частые-ошибки-при-работе-с-карточкой\"><h2>Частые ошибки при работе с карточкой</h2>\n<p>Пользователи часто смотрят только название и не проверяют тип объекта, не сопоставляют карточку с картой или делают выводы по неполной карточке, не учитывая роль и контур доступа. Если что-то кажется странным, нельзя сразу считать карточку неверной — сначала нужно понять, не ограничено ли её наполнение вашей ролью или типом объекта.</p>\n</section>"

                        "contentHtml": "<section id=\"attributes-and-materials-h-0-какие-данные-искать-в-карточке-в-первую-очередь\"><h2>Какие данные искать в карточке в первую очередь</h2>\n<p>Список важных атрибутов зависит от задачи, но обычно сначала проверяют название, тип, адрес, территориальную привязку, статус и основные классификационные признаки. Эти данные помогают быстрее понять, тот ли объект открыт и стоит ли дальше углубляться в материалы. Если базовые атрибуты не совпадают с ожиданием, нет смысла сразу переходить к документам.</p>\n</section>\n<section id=\"attributes-and-materials-h-1-когда-нужны-связанные-материалы\"><h3>Когда нужны связанные материалы</h3>\n<p>Связанные материалы полезны, когда одной карточки недостаточно для следующего шага. Это может быть подготовка к совещанию, проверка подтверждающих сведений, демонстрация объекта коллегам или сопоставление нескольких источников внутри продукта. Материалы становятся особенно важны, когда нужно не просто увидеть объект, а объяснить, почему именно он выбран и в каком контексте рассматривается.</p>\n</section>\n<section id=\"attributes-and-materials-h-2-как-просматривать-документы-и-вложения\"><h2>Как просматривать документы и вложения</h2>\n<p>Если в карточке доступны документы или вложения, открывайте их только после проверки, что это действительно нужный объект. При работе с несколькими схожими объектами полезно сначала зафиксировать себя на карте и убедиться в совпадении адреса, чтобы не тратить время на чтение материалов к неверной записи.</p>\n</section>\n<section id=\"attributes-and-materials-h-3-как-использовать-связанные-данные-в-анализе\"><h2>Как использовать связанные данные в анализе</h2>\n<p>Материалы внутри карточки лучше воспринимать как часть одного сценария. Например, пользователь находит объект, читает базовые атрибуты, открывает связанный материал, возвращается на карту и затем сохраняет нужный контекст в рабочем столе или подготовке к совещанию. Когда все эти шаги связаны между собой, продукт начинает работать как единая среда, а не как набор несвязанных экранов.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Блок атрибутов и доступ к связанным материалам в карточке объекта</figcaption></figure>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Просмотр документа или вложения, связанного с объектом</figcaption></figure>\n</section>\n<section id=\"attributes-and-materials-h-4-что-делать-если-материалов-нет\"><h3>Что делать, если материалов нет</h3>\n<p>Отсутствие документов не всегда означает проблему. Возможно, для данного типа объекта материалы не предусмотрены, не загружены или недоступны по роли. В такой ситуации сначала уточните, является ли наличие материалов ожидаемым для вашего сценария, и только потом поднимайте вопрос о неполноте данных.</p>\n</section>\n<section id=\"attributes-and-materials-h-5-какой-результат-считается-полезным\"><h2>Какой результат считается полезным</h2>\n<p>Хороший результат — это когда пользователь не просто открыл карточку, а смог подтвердить объект, извлечь нужные атрибуты и, при необходимости, использовать материалы как часть рабочего решения. Если документы или вложения были просмотрены, но не помогли понять объект или не связались с картой, сценарий выполнен только частично.</p>\n</section>\n<section id=\"attributes-and-materials-h-6-частые-ошибки-при-работе-с-материалами\"><h2>Частые ошибки при работе с материалами</h2>\n<p>К типовым ошибкам относятся открытие вложений без проверки объекта, ожидание одинакового набора документов для всех записей, игнорирование роли доступа и попытка использовать один документ как универсальный источник истины без привязки к текущему состоянию карточки и карты.</p>\n</section>"

                        "contentHtml": "<section id=\"favorites-and-saved-objects-h-0-зачем-сохранять-объекты\"><h2>Зачем сохранять объекты</h2>\n<p>Избранное полезно не только для часто используемых записей, но и для коротких рабочих циклов. Если вы сегодня собираете объекты для доклада, а завтра вернётесь к ним снова, лучше добавить их в сохранённый список, чем повторять поиск и заново вспоминать, какие из похожих записей были нужны. Это экономит время и делает повторную работу предсказуемой.</p>\n</section>\n<section id=\"favorites-and-saved-objects-h-1-когда-лучше-использовать-избранное\"><h3>Когда лучше использовать избранное</h3>\n<p>Сохраняйте объекты, если:</p>\n<ul><li>вы планируете вернуться к ним позже;</li><li>они участвуют в одном совещании или одной подборке;</li><li>по ним нужно последовательно открывать карточки и материалы;</li><li>они относятся к одному тематическому сценарию.</li></ul>\n<p>Если же объект нужен только на пару минут и не повторится позже, избранное можно не перегружать.</p>\n</section>\n<section id=\"favorites-and-saved-objects-h-2-как-добавлять-объекты-осмысленно\"><h2>Как добавлять объекты осмысленно</h2>\n<p>Добавляйте объект в избранное только после краткой проверки карточки. Это помогает избежать сохранения похожих, но неверных записей. Если система поддерживает группировку или тематические наборы, лучше сразу раскладывать объекты по смыслу: например, по территории, по теме совещания или по стадии работы.</p>\n</section>\n<section id=\"favorites-and-saved-objects-h-3-как-возвращаться-к-сохранeнным-объектам\"><h2>Как возвращаться к сохранённым объектам</h2>\n<p>При повторном открытии списка избранного не стоит сразу проходить по всем объектам подряд. Начните с текущей задачи и откройте только те записи, которые относятся к ней. Такой подход сохраняет список полезным и не превращает его в беспорядочную коллекцию ссылок. Если объект больше не нужен, его лучше своевременно убрать.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Добавление объекта в избранное и работа со списком сохранённых записей</figcaption></figure>\n</section>\n<section id=\"favorites-and-saved-objects-h-4-как-связать-избранное-с-остальными-сценариями\"><h3>Как связать избранное с остальными сценариями</h3>\n<p>Сохранённые объекты особенно удобны, когда используются вместе с рабочими столами, совещаниями и настройками слоёв. Пользователь может собрать важные записи, затем включить нужные слои, открыть связанный район и уже из этого контекста готовить демонстрацию или аналитическую проверку. В таком виде избранное работает как мост между поиском и повторяемой работой.</p>\n</section>\n<section id=\"favorites-and-saved-objects-h-5-что-считать-хорошим-результатом\"><h2>Что считать хорошим результатом</h2>\n<p>Хороший результат — это не просто длинный список сохранённых объектов, а понятный набор записей, к которым легко вернуться в нужный момент. Если пользователь может через день открыть избранное и быстро понять, зачем была сохранена каждая запись, значит система используется правильно.</p>\n</section>\n<section id=\"favorites-and-saved-objects-h-6-частые-ошибки-при-работе-с-сохранениями\"><h2>Частые ошибки при работе с сохранениями</h2>\n<p>Основные проблемы — сохранение объектов без проверки, отсутствие логики в группировке и накопление устаревших записей. Избранное начинает мешать, когда туда складывают всё подряд. Чтобы этого не происходило, полезно регулярно чистить список и держать в нём только действительно рабочие объекты.</p>\n</section>"

                        "contentHtml": "<section id=\"prepare-materials-h-0-зачем-готовить-материалы-заранее\"><h2>Зачем готовить материалы заранее</h2>\n<p>Совещание — плохое место для импровизации с картой, поиском и слоями. Даже если вы отлично знаете территорию, незаранее подготовленный показ почти всегда сопровождается лишними переходами, ожиданием загрузки и ненужными объяснениями. Подготовка нужна для того, чтобы в момент обсуждения думать о содержании, а не о том, где находится нужная кнопка или объект.</p>\n</section>\n<section id=\"prepare-materials-h-1-что-нужно-определить-до-начала-подготовки\"><h3>Что нужно определить до начала подготовки</h3>\n<p>Перед сборкой материалов ответьте на четыре вопроса:</p>\n<ul><li>какая территория будет в центре обсуждения;</li><li>какие объекты должны быть показаны обязательно;</li><li>какие слои нужны для аргументации;</li><li>какой результат ожидается от демонстрации.</li></ul>\n<p>Когда эти ответы есть, подготовка становится конкретной и измеримой.</p>\n</section>\n<section id=\"prepare-materials-h-2-как-собрать-рабочий-набор\"><h2>Как собрать рабочий набор</h2>\n<p>Обычно полезно начать с территории, затем найти основные объекты, открыть их карточки, выбрать 1–3 ключевых слоя и проверить читаемость карты в нужной подложке. После этого можно сохранить рабочий стол или последовательность показа, если контур это поддерживает. Важно не стремиться включить всё возможное: на совещании лучше работает небольшой, но чистый набор данных.</p>\n</section>\n<section id=\"prepare-materials-h-3-как-проверять-материалы-перед-показом\"><h2>Как проверять материалы перед показом</h2>\n<p>В конце подготовки пройдите сценарий так, как будто совещание уже началось. Откройте территорию, последовательно включите слои, проверьте карточки выбранных объектов и убедитесь, что все переходы понятны и не требуют лишних действий. Если на каком-то шаге вы колеблетесь, это значит, что сценарий ещё сырой и его стоит упростить.</p>\n<figure class=\"articleFigure imageFigure\"><div class=\"imagePlaceholder\"><i data-lucide=\"image\" width=\"38\" height=\"38\" stroke-width=\"1.55\"></i></div><figcaption class=\"caption\">Подготовка территории, объектов и слоёв перед совещанием</figcaption></figure>\n</section>\n<section id=\"prepare-materials-h-4-что-пользователь-должен-получить-на-выходе\"><h3>Что пользователь должен получить на выходе</h3>\n<p>На выходе должен появиться понятный показ: стартовая территория, набор обязательных объектов, заранее выбранные слои и последовательность действий, которую можно повторить без лишних пауз. Если вы смогли описать эту последовательность коллегам в двух-трёх предложениях, подготовка выполнена хорошо.</p>\n</section>\n<section id=\"prepare-materials-h-5-что-не-стоит-включать-в-демонстрационный-набор\"><h2>Что не стоит включать в демонстрационный набор</h2>\n<p>Не перегружайте показ дублирующими слоями, редко используемыми объектами и спорными вспомогательными материалами, которые не влияют на решение. Всё лишнее замедляет обсуждение и отвлекает внимание. Подготовка — это не накопление данных, а отбор того, что действительно помогает ответить на ключевой вопрос.</p>\n</section>\n<section id=\"prepare-materials-h-6-частые-ошибки-подготовки\"><h2>Частые ошибки подготовки</h2>\n<p>Основные ошибки — избыточный набор слоёв, отсутствие проверочного прогона, попытка показывать территории, которые пользователь сам плохо знает, и сохранение материалов без очевидной логики. Удачное совещание почти всегда начинается с аккуратной подготовки и избавления от лишнего.</p>\n</section>"
